<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<meta name="theme-color" content="#72c7ef">

<title>Whispering Garden</title>

<style>

/* =========================================================
   WHISPERING GARDEN
   Complete visual rebuild
   Functionality preserved + new voice objects
   ========================================================= */

:root {
    --sky-day:
        linear-gradient(
            180deg,
            #68baf0 0%,
            #a7dcf7 38%,
            #d8f1d0 67%,
            #78c85c 100%
        );

    --sky-night:
        linear-gradient(
            180deg,
            #071120 0%,
            #102742 42%,
            #1b3d4e 70%,
            #193b29 100%
        );

    --grass:
        linear-gradient(
            180deg,
            #79d15f 0%,
            #60bb4e 45%,
            #449b3d 100%
        );

    --grass-night:
        linear-gradient(
            180deg,
            #315f36 0%,
            #244b2c 55%,
            #173821 100%
        );
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    font-family:
        "Trebuchet MS",
        "Segoe UI",
        system-ui,
        sans-serif;
}

body {
    background: #68baf0;
    color: #19384c;
    transition: background 1.4s ease;
}

#garden-container {
    position: relative;
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    isolation: isolate;

    background:
        radial-gradient(
            circle at 15% 15%,
            rgba(255,255,255,.35),
            transparent 18%
        ),
        radial-gradient(
            circle at 80% 20%,
            rgba(255,241,178,.22),
            transparent 20%
        ),
        var(--sky-day);

    transition: background 1.5s ease;
}

body.night #garden-container {
    background:
        radial-gradient(
            circle at 78% 17%,
            rgba(150,190,230,.10),
            transparent 20%
        ),
        var(--sky-night);
}

/* =========================================================
   ATMOSPHERIC BACKGROUND
   ========================================================= */

#garden-container::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;

    background:
        radial-gradient(
            ellipse at 50% 62%,
            rgba(255,255,255,.15),
            transparent 42%
        ),
        linear-gradient(
            to bottom,
            transparent 0 55%,
            rgba(35,90,48,.08) 75%,
            rgba(20,68,35,.16) 100%
        );
}

/* =========================================================
   HEADER
   ========================================================= */

.app-header {
    position: absolute;
    z-index: 100;

    top: max(10px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);

    width: min(92%, 560px);

    padding: 11px 20px 12px;

    text-align: center;

    border-radius: 22px;

    background: rgba(255,255,255,.24);

    border: 1px solid rgba(255,255,255,.48);

    box-shadow:
        0 10px 35px rgba(30,75,100,.13),
        inset 0 1px 0 rgba(255,255,255,.5);

    backdrop-filter: blur(13px) saturate(130%);
    -webkit-backdrop-filter: blur(13px) saturate(130%);

    pointer-events: none;
}

.app-title {
    color: #173d55;

    font-size:
        clamp(1.3rem, 5vw, 2rem);

    font-weight: 800;

    letter-spacing: .7px;

    text-shadow:
        0 2px 10px rgba(255,255,255,.75);
}

.app-subtitle {
    margin-top: 3px;

    color: #28576d;

    font-size:
        clamp(.72rem, 2.5vw, .95rem);

    font-weight: 600;

    opacity: .9;
}

body.night .app-header {
    background: rgba(9,24,40,.42);
    border-color: rgba(220,240,255,.16);
}

body.night .app-title,
body.night .app-subtitle {
    color: #eaf7ff;
    text-shadow: 0 2px 10px rgba(0,0,0,.4);
}

/* =========================================================
   SKY
   ========================================================= */

.sky-zone {
    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    height: 57%;

    z-index: 2;

    pointer-events: none;

    overflow: hidden;
}

/* =========================================================
   SUN
   ========================================================= */

.sun {
    position: absolute;

    top: 18%;
    right: 8%;

    width:
        clamp(62px, 12vw, 100px);

    aspect-ratio: 1;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 32% 28%,
            #fffde9 0 8%,
            #ffe987 25%,
            #ffc44d 58%,
            #ef9524 100%
        );

    box-shadow:
        0 0 25px rgba(255,215,100,.8),
        0 0 65px rgba(255,195,60,.45),
        0 0 110px rgba(255,220,120,.22);

    transition:
        opacity 1s ease,
        transform 1s ease;
}

body.night .sun {
    opacity: 0;
    transform: scale(.45);
}

/* =========================================================
   MOON
   ========================================================= */

.moon {
    position: absolute;

    top: 18%;
    right: 8%;

    width:
        clamp(58px, 11vw, 88px);

    aspect-ratio: 1;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 34% 30%,
            #ffffff 0 12%,
            #edf3f8 45%,
            #b7c5d2 100%
        );

    box-shadow:
        0 0 25px rgba(240,250,255,.8),
        0 0 65px rgba(200,225,255,.35);

    opacity: 0;

    transform: scale(.45);

    transition:
        opacity 1s ease,
        transform 1s ease;
}

body.night .moon {
    opacity: 1;
    transform: scale(1);
}

/* =========================================================
   STARS
   ========================================================= */

.stars-container {
    position: absolute;
    inset: 0;

    opacity: 0;

    transition: opacity 1.2s ease;

    pointer-events: none;
}

body.night .stars-container,
.stars-container.manual-visible {
    opacity: 1;
}

.star {
    position: absolute;

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 6px white,
        0 0 12px rgba(255,255,255,.7);

    animation:
        twinkle 1.8s ease-in-out infinite alternate;
}

@keyframes twinkle {
    from {
        opacity: .3;
        transform: scale(.65);
    }

    to {
        opacity: 1;
        transform: scale(1.25);
    }
}

/* =========================================================
   RAINBOW EMOJI
   ========================================================= */

.rainbow-item {
    position: absolute;

    left: 50%;
    top: 30%;

    transform:
        translate(-50%, -50%)
        scale(.5);

    font-size:
        clamp(5rem, 18vw, 10rem);

    line-height: 1;

    opacity: 0;

    filter:
        drop-shadow(0 8px 8px rgba(40,80,100,.15))
        drop-shadow(0 0 12px rgba(255,255,255,.3));

    transition:
        opacity .8s ease,
        transform .8s cubic-bezier(.34,1.56,.64,1);

    user-select: none;
}

.rainbow-item.active {
    opacity: 1;

    transform:
        translate(-50%, -50%)
        scale(1);

    animation:
        rainbowFloat 5s ease-in-out infinite alternate;
}

@keyframes rainbowFloat {
    from {
        margin-top: 0;
    }

    to {
        margin-top: -7px;
    }
}

/* =========================================================
   CLOUDS
   ========================================================= */

.cloud-item {
    position: absolute;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.99),
            rgba(224,239,246,.9)
        );

    border-radius: 60px;

    opacity: 0;

    transform: scale(.55);

    box-shadow:
        0 8px 18px rgba(50,90,110,.12),
        inset 0 2px 3px rgba(255,255,255,.8);

    transition:
        opacity .7s ease,
        transform .7s cubic-bezier(.34,1.56,.64,1);

    animation: none;
}

.cloud-item::before,
.cloud-item::after {
    content: "";

    position: absolute;

    background:
        linear-gradient(
            180deg,
            #ffffff,
            #e4f0f5
        );

    border-radius: 50%;

    box-shadow:
        0 5px 12px rgba(60,90,110,.08);
}

.cloud-item::before {
    width: 48%;
    height: 120%;

    left: 13%;
    bottom: 8%;
}

.cloud-item::after {
    width: 43%;
    height: 110%;

    right: 12%;
    bottom: 5%;
}

.cloud-item.active {
    opacity: .96;
    transform: scale(1);

    animation:
        cloudDrift linear infinite;
}

@keyframes cloudDrift {
    from {
        translate: -150px 0;
    }

    to {
        translate: calc(100vw + 150px) 0;
    }
}

/* =========================================================
   BIRDS
   ========================================================= */

.bird-item {
    position: absolute;

    width: 34px;
    height: 22px;

    opacity: 0;

    transform: scale(.5);

    transition: opacity .5s ease;
}

.bird-item.active {
    opacity: 1;

    animation:
        birdFly 15s linear infinite;
}

.bird-wing {
    position: absolute;

    width: 17px;
    height: 10px;

    border-top:
        3px solid #23384a;

    border-radius:
        50% 50% 0 0;

    animation:
        wingFlap .35s ease-in-out infinite alternate;
}

.bird-wing::after {
    content: "";

    position: absolute;

    width: 17px;
    height: 10px;

    left: 14px;
    top: -3px;

    border-top:
        3px solid #23384a;

    border-radius:
        50% 50% 0 0;
}

body.night .bird-wing,
body.night .bird-wing::after {
    border-color: #dbeafe;
}

@keyframes wingFlap {
    from {
        transform: rotate(-20deg);
    }

    to {
        transform: rotate(30deg);
    }
}

@keyframes birdFly {
    0% {
        transform:
            translate(-60px, 0)
            scale(.8);
    }

    50% {
        transform:
            translate(50vw, -25px)
            scale(1);
    }

    100% {
        transform:
            translate(calc(100vw + 60px), 15px)
            scale(.8);
    }
}

/* =========================================================
   MIDDLE GARDEN
   ========================================================= */

.middle-zone {
    position: absolute;

    top: 36%;
    left: 0;
    right: 0;

    height: 34%;

    z-index: 5;

    pointer-events: none;
}

/* =========================================================
   TREES
   ========================================================= */

.tree-item {
    position: absolute;

    bottom: 5px;

    width:
        clamp(70px, 13vw, 110px);

    height:
        clamp(105px, 20vw, 155px);

    opacity: 0;

    transform: scale(.3);

    transition:
        opacity .7s ease,
        transform .8s cubic-bezier(.34,1.56,.64,1);

    filter:
        drop-shadow(
            0 9px 8px rgba(25,65,35,.25)
        );
}

.tree-item.active {
    opacity: 1;
    transform: scale(1);
}

.trunk {
    position: absolute;

    bottom: 0;
    left: 50%;

    width: 20px;
    height: 50%;

    transform: translateX(-50%);

    border-radius: 7px;

    background:
        linear-gradient(
            90deg,
            #583719,
            #996637 45%,
            #633c1d
        );

    box-shadow:
        inset 2px 0 rgba(255,255,255,.14);
}

.leaves {
    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    height: 68%;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 30% 25%,
            #78d45e 0 12%,
            transparent 13%
        ),
        radial-gradient(
            circle at 67% 23%,
            #62c952 0 14%,
            transparent 15%
        ),
        radial-gradient(
            circle at 45% 58%,
            #46aa43 0 32%,
            #2d8138 78%
        );

    box-shadow:
        inset -12px -14px 18px rgba(20,83,34,.2),
        inset 8px 7px 12px rgba(255,255,255,.12),
        0 9px 15px rgba(21,74,33,.18);
}

body.night .leaves {
    filter: brightness(.65);
}

/* =========================================================
   HOUSE
   ========================================================= */

.house {
    position: absolute;

    left: 50%;
    bottom: 10px;

    width:
        clamp(110px, 21vw, 155px);

    height:
        clamp(100px, 19vw, 140px);

    transform:
        translateX(-50%)
        scale(.3);

    opacity: 0;

    transition:
        opacity .8s ease,
        transform .8s cubic-bezier(.34,1.56,.64,1);

    filter:
        drop-shadow(
            0 12px 12px rgba(35,54,38,.25)
        );
}

.house.active {
    opacity: 1;

    transform:
        translateX(-50%)
        scale(1);
}

.house-body {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 65%;

    border-radius: 7px;

    background:
        linear-gradient(
            90deg,
            #eee5d4,
            #fffaf0 45%,
            #e4d8c5
        );

    border: 1px solid rgba(100,70,40,.15);

    box-shadow:
        0 8px 18px rgba(40,45,35,.18),
        inset 0 1px rgba(255,255,255,.8);
}

.house-roof {
    position: absolute;

    z-index: 2;

    top: 0;
    left: -11px;
    right: -11px;

    height: 45%;

    background:
        linear-gradient(
            145deg,
            #a92e2a,
            #e3523c 50%,
            #9d2927
        );

    clip-path:
        polygon(
            50% 0%,
            0% 100%,
            100% 100%
        );

    filter:
        drop-shadow(
            0 5px 5px rgba(55,30,25,.25)
        );
}

.house-door {
    position: absolute;

    bottom: 0;
    left: 50%;

    transform: translateX(-50%);

    width: 27px;
    height: 44px;

    border-radius:
        14px 14px 0 0;

    background:
        linear-gradient(
            90deg,
            #563217,
            #895229 50%,
            #573217
        );

    box-shadow:
        inset 2px 0 rgba(255,255,255,.13);
}

.house-window {
    position: absolute;

    top: 25px;

    width: 27px;
    height: 27px;

    border: 3px solid #fff8eb;

    border-radius: 5px;

    background:
        linear-gradient(
            135deg,
            #c7f5ff,
            #69c8e7 55%,
            #3d91af
        );

    box-shadow:
        inset 0 0 7px rgba(255,255,255,.7),
        0 3px 6px rgba(40,65,75,.18);
}

.house-window.left {
    left: 18px;
}

.house-window.right {
    right: 18px;
}

/* =========================================================
   ANIMALS + PEOPLE
   ========================================================= */

.creature {
    position: absolute;

    opacity: 0;

    transform:
        translateY(12px)
        scale(.5);

    transition:
        opacity .6s ease,
        transform .6s cubic-bezier(.34,1.56,.64,1);

    user-select: none;

    filter:
        drop-shadow(
            0 6px 6px rgba(35,50,40,.22)
        );
}

.creature.active {
    opacity: 1;

    transform:
        translateY(0)
        scale(1);
}

/* ---------- DOG ---------- */

.dog-item {
    width: 62px;
    height: 48px;
}

.dog-body {
    position: absolute;

    width: 43px;
    height: 25px;

    left: 10px;
    bottom: 6px;

    border-radius:
        45% 50% 40% 40%;

    background:
        linear-gradient(
            135deg,
            #d99a55,
            #b86e31
        );
}

.dog-head {
    position: absolute;

    width: 28px;
    height: 28px;

    left: 0;
    bottom: 19px;

    border-radius: 48%;

    background:
        linear-gradient(
            135deg,
            #e4aa63,
            #b76d31
        );
}

.dog-ear {
    position: absolute;

    width: 11px;
    height: 17px;

    top: 0;

    background: #8b4f28;

    border-radius:
        60% 20% 60% 30%;
}

.dog-ear.one {
    left: 2px;
    transform: rotate(-25deg);
}

.dog-ear.two {
    right: 1px;
    transform: rotate(25deg);
}

.dog-eye {
    position: absolute;

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background: #17202a;

    left: 16px;
    top: 10px;
}

.dog-nose {
    position: absolute;

    width: 6px;
    height: 5px;

    border-radius: 50%;

    background: #302019;

    left: 1px;
    top: 15px;
}

.dog-leg {
    position: absolute;

    bottom: 0;

    width: 7px;
    height: 14px;

    border-radius: 4px;

    background: #9b5c2c;
}

.dog-leg.one {
    left: 18px;
}

.dog-leg.two {
    left: 40px;
}

.dog-tail {
    position: absolute;

    width: 22px;
    height: 16px;

    right: 0;
    bottom: 22px;

    border-top:
        5px solid #b86e31;

    border-radius: 50%;

    transform: rotate(25deg);
}

/* ---------- CAT ---------- */

.cat-item {
    width: 58px;
    height: 50px;
}

.cat-body {
    position: absolute;

    width: 40px;
    height: 24px;

    bottom: 5px;
    left: 9px;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #aeb8c3,
            #697583
        );
}

.cat-head {
    position: absolute;

    width: 28px;
    height: 28px;

    left: 0;
    bottom: 18px;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #c4cbd2,
            #747f8b
        );
}

.cat-ear {
    position: absolute;

    top: -5px;

    width: 13px;
    height: 15px;

    background: #87929e;

    clip-path:
        polygon(
            50% 0,
            100% 100%,
            0 100%
        );
}

.cat-ear.one {
    left: 2px;
}

.cat-ear.two {
    right: 2px;
}

.cat-eye {
    position: absolute;

    width: 4px;
    height: 5px;

    border-radius: 50%;

    background: #273b20;

    top: 10px;
}

.cat-eye.one {
    left: 7px;
}

.cat-eye.two {
    right: 7px;
}

.cat-nose {
    position: absolute;

    left: 12px;
    top: 16px;

    width: 5px;
    height: 4px;

    background: #e78c9e;

    border-radius: 50%;
}

.cat-tail {
    position: absolute;

    right: 0;
    bottom: 17px;

    width: 22px;
    height: 23px;

    border:
        5px solid #737f8c;

    border-left: 0;
    border-bottom: 0;

    border-radius: 50%;
}

/* =========================================================
   PEOPLE
   ========================================================= */

.person {
    width: 44px;
    height: 86px;
}

.person-head {
    position: absolute;

    top: 0;
    left: 50%;

    transform: translateX(-50%);

    width: 27px;
    height: 27px;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #f4c49b,
            #c98659
        );

    box-shadow:
        inset -4px -4px 6px rgba(120,65,35,.12);
}

.person-body {
    position: absolute;

    top: 26px;
    left: 50%;

    transform: translateX(-50%);

    width: 31px;
    height: 38px;

    border-radius:
        12px 12px 6px 6px;
}

.person-leg {
    position: absolute;

    top: 61px;

    width: 9px;
    height: 25px;

    border-radius: 5px;
}

.person-leg.left {
    left: 12px;
}

.person-leg.right {
    right: 12px;
}

.person-arm {
    position: absolute;

    top: 29px;

    width: 7px;
    height: 28px;

    border-radius: 5px;
}

.person-arm.left {
    left: 2px;
    transform: rotate(13deg);
}

.person-arm.right {
    right: 2px;
    transform: rotate(-13deg);
}

/* MAN */

.man-item .person-head::before {
    content: "";

    position: absolute;

    top: -4px;
    left: 3px;

    width: 21px;
    height: 9px;

    border-radius:
        60% 60% 30% 30%;

    background: #38251d;
}

.man-item .person-body,
.man-item .person-arm {
    background:
        linear-gradient(
            135deg,
            #3976a8,
            #235178
        );
}

.man-item .person-leg {
    background:
        linear-gradient(
            90deg,
            #252f42,
            #172033
        );
}

/* WOMAN */

.woman-item .person-head::before {
    content: "";

    position: absolute;

    top: -6px;
    left: -5px;

    width: 37px;
    height: 42px;

    z-index: -1;

    border-radius:
        48% 48% 55% 55%;

    background:
        linear-gradient(
            135deg,
            #4b2d24,
            #241914
        );
}

.woman-item .person-body {
    width: 36px;
    height: 43px;

    background:
        linear-gradient(
            135deg,
            #d45c83,
            #9e315a
        );

    border-radius:
        12px 12px 20px 20px;
}

.woman-item .person-arm {
    background: #d45c83;
}

.woman-item .person-leg {
    background:
        linear-gradient(
            90deg,
            #7c3b51,
            #55283a
        );
}

/* HUMAN */

.human-item .person-head::before {
    content: "";

    position: absolute;

    top: -3px;
    left: 4px;

    width: 19px;
    height: 8px;

    border-radius: 50%;

    background: #594c42;
}

.human-item .person-body,
.human-item .person-arm {
    background:
        linear-gradient(
            135deg,
            #58a36b,
            #34734b
        );
}

.human-item .person-leg {
    background:
        linear-gradient(
            90deg,
            #536274,
            #303c4c
        );
}

/* =========================================================
   BUTTERFLIES
   ========================================================= */

.butterfly-item {
    position: absolute;

    width: 30px;
    height: 25px;

    opacity: 0;

    transform: scale(.3);

    transition:
        opacity .5s ease,
        transform .6s cubic-bezier(.34,1.56,.64,1);
}

.butterfly-item.active {
    opacity: 1;

    transform: scale(1);

    animation:
        flutter 4s ease-in-out infinite alternate;
}

.butterfly-wing {
    position: absolute;

    width: 13px;
    height: 20px;

    top: 2px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #fff19a 0 8%,
            #ff9d43 32%,
            #ef5275 100%
        );

    box-shadow:
        0 3px 7px rgba(100,45,47,.2);
}

.butterfly-wing.left {
    left: 0;
    transform-origin: right center;

    animation:
        wingLeft .18s ease-in-out infinite alternate;
}

.butterfly-wing.right {
    right: 0;
    transform-origin: left center;

    animation:
        wingRight .18s ease-in-out infinite alternate;
}

@keyframes wingLeft {
    from {
        transform: rotateY(0deg);
    }

    to {
        transform: rotateY(70deg);
    }
}

@keyframes wingRight {
    from {
        transform: rotateY(0deg);
    }

    to {
        transform: rotateY(-70deg);
    }
}

@keyframes flutter {
    0% {
        translate: 0 0;
        rotate: -5deg;
    }

    50% {
        translate: 0 -18px;
        rotate: 5deg;
    }

    100% {
        translate: 0 -6px;
        rotate: -3deg;
    }
}

/* =========================================================
   FLOWERS
   ========================================================= */

.flower-zone {
    position: absolute;

    bottom: 82px;
    left: 0;
    right: 0;

    height: 25%;

    z-index: 7;

    pointer-events: none;
}

.flower-item {
    position: absolute;

    bottom: 8px;

    width: 36px;
    height: 57px;

    opacity: 0;

    transform: scale(0);

    transition:
        opacity .6s ease,
        transform .6s cubic-bezier(.34,1.56,.64,1);

    filter:
        drop-shadow(
            0 4px 4px rgba(35,83,39,.2)
        );
}

.flower-item.active {
    opacity: 1;

    transform: scale(1);

    animation:
        sway 3s ease-in-out infinite alternate;
}

.flower-stem {
    position: absolute;

    bottom: 0;
    left: 50%;

    width: 4px;
    height: 36px;

    transform: translateX(-50%);

    border-radius: 3px;

    background:
        linear-gradient(
            90deg,
            #28763a,
            #62ad53,
            #286a34
        );
}

.flower-bloom {
    position: absolute;

    top: 0;
    left: 50%;

    width: 27px;
    height: 27px;

    transform: translateX(-50%);

    border-radius: 50%;

    box-shadow:
        0 3px 8px rgba(52,51,36,.18),
        inset 2px 2px 5px rgba(255,255,255,.35);
}

.flower-bloom::after {
    content: "";

    position: absolute;

    left: 7px;
    top: 7px;

    width: 13px;
    height: 13px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #fff6a1,
            #e9a91c
        );
}

@keyframes sway {
    from {
        rotate: -3deg;
    }

    to {
        rotate: 3deg;
    }
}

/* =========================================================
   GRASS
   ========================================================= */

.grass-layer {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 48%;

    z-index: 1;

    background:
        radial-gradient(
            ellipse at 15% 15%,
            rgba(135,220,90,.45),
            transparent 25%
        ),
        radial-gradient(
            ellipse at 75% 18%,
            rgba(140,220,95,.3),
            transparent 27%
        ),
        var(--grass);

    border-radius:
        50% 50% 0 0 / 30px 30px 0 0;

    box-shadow:
        inset 0 16px 28px rgba(255,255,255,.1);
}

.grass-layer::after {
    content: "";

    position: absolute;

    inset: 0;

    opacity: .16;

    background:
        repeating-linear-gradient(
            78deg,
            transparent 0 14px,
            rgba(25,91,39,.38) 15px 17px,
            transparent 18px 31px
        );

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent
        );
}

body.night .grass-layer {
    background: var(--grass-night);
}

/* =========================================================
   RAIN
   ========================================================= */

.rain-container,
.snow-container {
    position: absolute;

    inset: 0;

    z-index: 25;

    pointer-events: none;

    overflow: hidden;

    opacity: 0;

    transition: opacity .7s ease;
}

.rain-container.active,
.snow-container.active {
    opacity: 1;
}

.raindrop {
    position: absolute;

    top: -30px;

    width: 2px;
    height: 18px;

    border-radius: 50%;

    background:
        linear-gradient(
            to bottom,
            rgba(255,255,255,.12),
            rgba(205,237,255,.85)
        );

    animation:
        rainFall linear infinite;
}

@keyframes rainFall {
    from {
        transform: translateY(-30px);
    }

    to {
        transform: translateY(110vh);
    }
}

/* =========================================================
   SNOW
   ========================================================= */

.snowflake {
    position: absolute;

    top: -20px;

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: rgba(255,255,255,.95);

    box-shadow:
        0 0 8px rgba(255,255,255,.8);

    animation:
        snowFall linear infinite;
}

@keyframes snowFall {
    0% {
        transform:
            translate3d(0,-20px,0)
            rotate(0);
    }

    50% {
        transform:
            translate3d(25px,50vh,0)
            rotate(180deg);
    }

    100% {
        transform:
            translate3d(-20px,110vh,0)
            rotate(360deg);
    }
}

/* =========================================================
   RIVER
   ========================================================= */

.river-zone {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 100px;

    z-index: 20;

    transform: translateY(110%);

    transition:
        transform 1s cubic-bezier(.34,1.56,.64,1);

    overflow: hidden;

    background:
        repeating-linear-gradient(
            -8deg,
            rgba(255,255,255,.10) 0 3px,
            transparent 3px 17px
        ),
        linear-gradient(
            180deg,
            #4ba8d7,
            #277eb8 50%,
            #175d96
        );

    box-shadow:
        inset 0 10px 18px rgba(255,255,255,.18),
        inset 0 -14px 20px rgba(5,55,95,.2);
}

.river-zone.visible {
    transform: translateY(0);
}

.river-zone::before,
.river-zone::after {
    content: "";

    position: absolute;

    width: 35%;
    height: 10px;

    top: 25px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.25);

    animation:
        waterShimmer 4s ease-in-out infinite alternate;
}

.river-zone::before {
    left: 8%;
}

.river-zone::after {
    right: 8%;
    animation-delay: 1.4s;
}

@keyframes waterShimmer {
    from {
        transform:
            translateX(-8px)
            scaleX(.9);
        opacity: .3;
    }

    to {
        transform:
            translateX(12px)
            scaleX(1.1);
        opacity: .75;
    }
}

/* =========================================================
   BOAT
   ========================================================= */

.boat {
    position: absolute;

    left: -70px;
    bottom: 17px;

    width: 58px;
    height: 33px;

    opacity: 0;

    border-radius:
        0 0 28px 28px;

    background:
        linear-gradient(
            180deg,
            #e99a31,
            #b85d12
        );

    filter:
        drop-shadow(
            0 7px 6px rgba(20,53,70,.3)
        );
}

.boat.active {
    opacity: 1;

    animation:
        sail 14s linear infinite,
        bobWater 2s ease-in-out infinite alternate;
}

@keyframes sail {
    from {
        left: -70px;
    }

    to {
        left: calc(100vw + 70px);
    }
}

@keyframes bobWater {
    from {
        transform:
            translateY(0)
            rotate(-2deg);
    }

    to {
        transform:
            translateY(-5px)
            rotate(2deg);
    }
}

.boat-sail {
    position: absolute;

    bottom: 31px;
    left: 23px;

    width: 0;
    height: 0;

    border-left: 17px solid transparent;
    border-right: 6px solid transparent;
    border-bottom: 28px solid #fffdf4;
}

/* =========================================================
   VISUAL COMMAND FEEDBACK
   ========================================================= */

.highlight-pulse {
    animation:
        pulseGlow .65s ease !important;
}

@keyframes pulseGlow {
    0% {
        filter:
            drop-shadow(
                0 0 0 transparent
            );

        scale: 1;
    }

    50% {
        filter:
            drop-shadow(
                0 0 18px #ffe66d
            );

        scale: 1.08;
    }

    100% {
        filter:
            drop-shadow(
                0 0 0 transparent
            );

        scale: 1;
    }
}

/* =========================================================
   CONTROLS
   ========================================================= */

.control-panel {
    position: absolute;

    left: 50%;
    bottom:
        max(
            12px,
            env(safe-area-inset-bottom)
        );

    transform: translateX(-50%);

    z-index: 100;

    display: flex;
    align-items: center;

    gap: 9px;

    padding: 8px 11px;

    border-radius: 30px;

    background:
        rgba(255,255,255,.72);

    border:
        1px solid rgba(255,255,255,.55);

    box-shadow:
        0 14px 38px rgba(27,60,74,.2),
        inset 0 1px rgba(255,255,255,.8);

    backdrop-filter:
        blur(18px)
        saturate(135%);

    -webkit-backdrop-filter:
        blur(18px)
        saturate(135%);
}

.control-btn {
    width: 48px;
    height: 48px;

    border: none;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        rgba(255,255,255,.9);

    color: #23475b;

    font-size: 1.2rem;

    cursor: pointer;

    box-shadow:
        0 5px 13px rgba(34,67,80,.14),
        inset 0 1px rgba(255,255,255,.9);

    transition:
        transform .18s ease,
        background .18s ease;
}

.control-btn:active {
    transform: scale(.9);
}

.control-btn.active-mic {
    color: white;

    background:
        linear-gradient(
            145deg,
            #34d399,
            #16a34a
        );

    box-shadow:
        0 0 0 5px rgba(34,197,94,.13),
        0 7px 18px rgba(22,163,74,.32);
}

.status-indicator {
    min-width: 92px;

    text-align: center;

    font-size: .82rem;

    font-weight: 800;

    color: #294c5d;
}

body.night .control-panel {
    background:
        rgba(9,24,38,.74);

    border-color:
        rgba(220,240,255,.14);
}

body.night .control-btn {
    background:
        rgba(43,65,82,.9);

    color: #eff8ff;
}

body.night .status-indicator {
    color: #dcecf7;
}

/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 520px) {

    .app-header {
        width: calc(100% - 22px);
        padding: 9px 14px 10px;
        border-radius: 19px;
    }

    .app-subtitle {
        font-size: .73rem;
    }

    .control-panel {
        gap: 6px;
        padding: 7px 8px;
    }

    .control-btn {
        width: 44px;
        height: 44px;
        font-size: 1.08rem;
    }

    .status-indicator {
        min-width: 78px;
        font-size: .72rem;
    }

    .rainbow-item {
        top: 32%;
    }

    .river-zone {
        height: 92px;
    }

    .dog-item {
        transform-origin: bottom left;
    }

    .cat-item {
        transform-origin: bottom left;
    }

    .person {
        transform-origin: bottom center;
    }
}

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
    }
}

<body>

<div id="garden-container">

<script>

/* =========================================================
   STATE
   ========================================================= */

let recognition = null;

let isListening = false;

let manualStop = false;

let audioCtx = null;

let musicInterval = null;

let isMusicPlaying = false;

let isNight = false;

let rainbowActive = false;

let snowActive = false;

let starsManuallyVisible = false;

let flowerCount = 0;
let treeCount = 0;
let butterflyCount = 0;
let birdCount = 0;
let cloudCount = 0;
let starCount = 0;
let dogCount = 0;
let catCount = 0;
let manCount = 0;
let womanCount = 0;
let humanCount = 0;

const maxElements = 10;


/* =========================================================
   FIXED POSITIONS
   ========================================================= */

/* Flowers */

const flowerSlots = [

    { left: "5%" },
    { left: "14%" },
    { left: "24%" },
    { left: "34%" },
    { left: "44%" },

    { right: "44%" },
    { right: "34%" },
    { right: "24%" },
    { right: "14%" },
    { right: "5%" }

];


/* Flowers colors */

const flowerColors = [

    "#ff5f7e",
    "#ff9f68",
    "#a96be8",
    "#ffd84d",
    "#42cbd0",
    "#ff6bb4",
    "#ff6a3d",
    "#9270e8",
    "#48b878",
    "#ff3d91"

];


/* Trees only at the sides */

const treeSlots = [

    {
        side: "left",
        pos: "1%"
    },

    {
        side: "right",
        pos: "1%"
    },

    {
        side: "left",
        pos: "12%"
    },

    {
        side: "right",
        pos: "12%"
    },

    {
        side: "left",
        pos: "24%"

    {
        side: "right",
        pos: "24%"
    },

    {
        side: "left",
        pos: "36%"
    },

    {
        side: "right",
        pos: "36%"
    },

    {
        side: "left",
        pos: "46%"
    },

    {
        side: "right",
        pos: "46%"
    }

];


/* Butterflies */

const butterflySlots = [

    { top: "40%", left: "17%" },
    { top: "44%", right: "17%" },
    { top: "49%", left: "27%" },
    { top: "42%", right: "27%" },
    { top: "52%", left: "36%" },
    { top: "47%", right: "36%" },
    { top: "35%", left: "22%" },
    { top: "50%", right: "22%" },
    { top: "45%", left: "31%" },
    { top: "40%", right: "31%" }

];


/* Birds */

const birdSlots = [

    { top: "70px", delay: "0s" },
    { top: "110px", delay: "2s" },
    { top: "90px", delay: "4s" },
    { top: "130px", delay: "1s" },
    { top: "60px", delay: "3s" },
    { top: "100px", delay: "5s" },
    { top: "80px", delay: "2.5s" },
    { top: "120px", delay: "1.5s" },
    { top: "95px", delay: "3.5s" },
    { top: "140px", delay: "4.5s" }

];


/* Clouds */

const cloudSlots = [

    {
        top: "32px",
        width: "90px",
        height: "32px",
        delay: "0s",
        duration: "22s"
    },

    {
        top: "90px",
        width: "120px",
        height: "40px",
        delay: "7s",
        duration: "28s"
    },

    {
        top: "52px",

        duration: "25s"
    },

    {
        top: "120px",
        width: "80px",
        height: "28px",
        delay: "12s",
        duration: "30s"
    },

    {
        top: "72px",
        width: "110px",
        height: "38px",
        delay: "5s",
        duration: "24s"
    },

    {
        top: "100px",

        duration: "26s"
    },

    {
        top: "42px",
        width: "130px",

        delay: "15s",

    },

    {
        top: "140px",

        duration: "20s"
    },

    {
        top: "85px",
        width: "105px",
        height: "36px",
        delay: "11s",
        duration: "27s"
    },

    {
        top: "115px",
        width: "115px",
        height: "40px",
        delay: "6s",
        duration: "29s"
    }

];


/* Stars */

const starSlots = [

    { top: "13%", left: "8%", size: "3px", delay: "0s" },
    { top: "25%", left: "23%", size: "4px", delay: ".5s" },
    { top: "12%", left: "39%", size: "2px", delay: "1s" },
    { top: "30%", left: "57%", size: "3px", delay: ".2s" },
    { top: "18%", left: "74%", size: "4px", delay: ".8s" },
    { top: "34%", left: "88%", size: "2px", delay: "1.2s" },
    { top: "8%", left: "19%", size: "3px", delay: ".4s" },
    { top: "22%", left: "50%", size: "3px", delay: ".7s" },
    { top: "10%", left: "84%", size: "2px", delay: ".1s" },
    { top: "28%", left: "15%", size: "4px", delay: ".9s" }

];


/* =========================================================
   INITIALIZE OBJECTS
   ========================================================= */

function initGardenElements() {

    const flowerZone =
        document.getElementById("flower-zone");

    flowerSlots.forEach((slot, i) => {

        const el =
            document.createElement("div");

        el.className = "flower-item";

        el.id = `flower-${i}`;

        if (slot.left)
            el.style.left = slot.left;

        if (slot.right)
            el.style.right = slot.right;

        el.innerHTML = `

            <div class="flower-stem"></div>

            <div
                class="flower-bloom"
                style="
                    background:
                    ${flowerColors[i]};
                "
            ></div>

        `;

        flowerZone.appendChild(el);

    });


    /* Trees */

    const middleZone =
        document.getElementById("middle-zone");

    treeSlots.forEach((slot, i) => {

        const el =
            document.createElement("div");

        el.className = "tree-item";

        el.id = `tree-${i}`;

        el.style[slot.side] =
            slot.pos;

        el.innerHTML = `

            <div class="trunk"></div>

            <div class="leaves"></div>

        `;

        middleZone.appendChild(el);

    });


    /* Butterflies */

    butterflySlots.forEach((slot, i) => {

        const el =
            document.createElement("div");

        el.className =
            "butterfly-item";

        el.id =
            `butterfly-${i}`;

        el.style.top =
            slot.top;

        if (slot.left)
            el.style.left =
                slot.left;

        if (slot.right)
            el.style.right =
                slot.right;

        el.innerHTML = `

            <div
                class="butterfly-wing left"
            ></div>

            <div
                class="butterfly-wing right"
            ></div>

        `;

        middleZone.appendChild(el);

    });


    /* Birds */

    const skyZone =
        document.getElementById("sky-zone");

    birdSlots.forEach((slot, i) => {

        const el =
            document.createElement("div");

        el.className =
            "bird-item";

        el.id =
            `bird-${i}`;

        el.style.top =
            slot.top;

        el.style.animationDelay =
            slot.delay;

        const wing =
            document.createElement("div");

        wing.className =
            "bird-wing";

        el.appendChild(wing);

        skyZone.appendChild(el);

    });


    /* Clouds */

    cloudSlots.forEach((slot, i) => {

        const el =
            document.createElement("div");

        el.className =
            "cloud-item";

        el.id =
            `cloud-${i}`;

        el.style.top =
            slot.top;

        el.style.width =
            slot.width;

        el.style.height =
            slot.height;

        el.style.animationDelay =
            slot.delay;

        el.style.animationDuration =
            slot.duration;

        skyZone.appendChild(el);

    });


    /* Stars */

    const stars =
        document.getElementById(
            "stars-container"
        );

    starSlots.forEach((slot, i) => {

        const el =
            document.createElement("div");

        el.className = "star";

        el.style.top =
            slot.top;

        el.style.left =
            slot.left;

        el.style.width =
            slot.size;

        el.style.height =
            slot.size;

        el.style.animationDelay =
            slot.delay;

        stars.appendChild(el);

    });


    createCreatures();

}


/* =========================================================

/* =========================================================
   AUDIO
   ========================================================= */

function initAudio() {

    try {

        if (!audioCtx) {

            audioCtx =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        if (
            audioCtx.state ===
            "suspended"
        ) {

            audioCtx.resume();

        }

    } catch (e) {}

}


function playTone(
    freq,
    type,
    duration,
    gainVal = .1
) {

    try {

        initAudio();

        const now =
            audioCtx.currentTime;

        const osc =
            audioCtx.createOscillator();

        const gain =
            audioCtx.createGain();

        osc.type = type;

        osc.frequency.setValueAtTime(
            freq,
            now
        );

        gain.gain.setValueAtTime(
            gainVal,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            .0001,
            now + duration
        );

        osc.connect(gain);

        gain.connect(
            audioCtx.destination
        );

        osc.start(now);

        osc.stop(
            now + duration
        );

    } catch (e) {}

}

/* Rain */

function playRainSound() {

    try {

        initAudio();

        const now =
            audioCtx.currentTime;

        const bufferSize =
            audioCtx.sampleRate * 2;

        const buffer =
            audioCtx.createBuffer(
                1,
                bufferSize,
                audioCtx.sampleRate
            );

        const output =
            buffer.getChannelData(0);

        for (
            let i = 0;
            i < bufferSize;
            i++
        ) {

            output[i] =
                Math.random() * 2 - 1;

        }

        const source =
            audioCtx.createBufferSource();

        source.buffer = buffer;

        const filter =
            audioCtx.createBiquadFilter();

        filter.type =
            "lowpass";

        filter.frequency.setValueAtTime(
            1100,
            now
        );

        const gain =
            audioCtx.createGain();

        gain.gain.setValueAtTime(
            .015,
            now
        );

        gain.gain.linearRampToValueAtTime(
            .10,
            now + .5
        );

        gain.gain.linearRampToValueAtTime(
            .01,
            now + 2
        );

        source.connect(filter);

        filter.connect(gain);

        gain.connect(
            audioCtx.destination
        );

        source.start(now);

        source.stop(
            now + 2
        );

    } catch (e) {}

}


/* River */

function playRiverSound() {

    try {

        initAudio();

        const now =
            audioCtx.currentTime;

        const bufferSize =
            audioCtx.sampleRate * 1.5;

        const buffer =
            audioCtx.createBuffer(
                1,
                bufferSize,
                audioCtx.sampleRate
            );

        const output =
            buffer.getChannelData(0);

        for (
            let i = 0;
            i < bufferSize;
            i++
        ) {

            output[i] =
                Math.random() * 2 - 1;

        }

        const source =
            audioCtx.createBufferSource();

        source.buffer =
            buffer;

        const filter =
            audioCtx.createBiquadFilter();

        filter.type =
            "bandpass";

        filter.frequency.setValueAtTime(
            450,
            now
        );

        filter.Q.setValueAtTime(
            1.5,
            now
        );

        const gain =
            audioCtx.createGain();

        gain.gain.setValueAtTime(
            .01,
            now
        );

        gain.gain.linearRampToValueAtTime(
            .12,
            now + .5
        );

        gain.gain.linearRampToValueAtTime(
            .01,
            now + 1.5
        );

        source.connect(filter);

        filter.connect(gain);

        gain.connect(
            audioCtx.destination
        );

        source.start(now);

        source.stop(
            now + 1.5
        );

    } catch (e) {}

}

function startBackgroundMusic() {

    if (isMusicPlaying)
        return;

    initAudio();

    isMusicPlaying = true;

    const musicBtn =
        document.getElementById(
            "music-btn"
        );

    musicBtn.style.background =
        "#22c55e";

    musicBtn.style.color =
        "#fff";

    const chordNotes = [

        261.63,
        329.63,
        392,
        523.25

    ];

    /* Immediate first note */

    playTone(
        261.63,
        "sine",
        2.4,
        .065
    );

    musicInterval =
        setInterval(() => {

            if (!isMusicPlaying)
                return;

            const note =
                chordNotes[
                    Math.floor(
                        Math.random() *
                        chordNotes.length
                    )
                ];

            playTone(
                note,
                "sine",
                2.4,
                .065
            );

        }, 3000);

}


function stopBackgroundMusic() {

    isMusicPlaying = false;

    if (musicInterval) {

        clearInterval(
            musicInterval
        );

        musicInterval = null;

    }

    const musicBtn =
        document.getElementById(
            "music-btn"
        );

    musicBtn.style.background =
        "";

    musicBtn.style.color =
        "";

}


/* =========================================================
   TTS WELCOME
   ========================================================= */

function speakWelcome() {

    const welcomeText =
        "Welcome to the garden. You can say flower, tree, house, butterfly, bird, cloud, rain, river, boat, rainbow, dog, cat, man, woman, human, sun, day, moon, night, star, or snow.";

    stopRecognition();

    updateStatus(
        "Welcome..."
    );

    if (
        "speechSynthesis"
        in window
    ) {

        window.speechSynthesis.cancel();

        const utterance =
            new SpeechSynthesisUtterance(
                welcomeText
            );

        utterance.rate = .9;

        utterance.pitch = 1;

        utterance.volume = 1;

        utterance.onend = () => {

            startBackgroundMusic();

            setTimeout(
                startRecognition,
                350
            );

        };

        utterance.onerror = () => {

            startBackgroundMusic();

            startRecognition();

        };

        window.speechSynthesis.speak(
            utterance
        );

    } else {

        startBackgroundMusic();

        startRecognition();

    }

}


/* =========================================================
   SPEECH RECOGNITION
   ========================================================= */

function setupSpeechRecognition() {

    const SpeechRecognitionAPI =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognitionAPI) {

        updateStatus(
            "Voice unsupported"
        );

        return;

    }

    recognition =
        new SpeechRecognitionAPI();

    recognition.lang =
        "en-IN";

    recognition.continuous =
        true;

    recognition.interimResults =
        false;

    recognition.maxAlternatives =
        1;


    recognition.onstart = () => {

        isListening = true;

        document
            .getElementById("mic-btn")
            .classList
            .add("active-mic");

        updateStatus(
            "Listening..."
        );

    };


    recognition.onresult =
        event => {

            const lastIndex =
                event.results.length - 1;

            const transcript =
                event
                    .results[lastIndex][0]
                    .transcript
                    .toLowerCase()
                    .trim();

            handleCommand(
                transcript
            );

        };


    recognition.onerror =
        event => {

            if (
                event.error ===
                "not-allowed"
            ) {

                updateStatus(
                    "Mic blocked"
                );

                manualStop = true;

            }

        };


    recognition.onend = () => {

        isListening = false;

        document
            .getElementById("mic-btn")
            .classList
            .remove("active-mic");

        if (!manualStop) {

            setTimeout(() => {

                if (
                    !manualStop &&
                    !isListening
                ) {

                    startRecognition();

                }

            }, 250);

        } else {

            updateStatus(
                "Microphone off"
            );

        }

    };

}


function startRecognition() {

    if (!recognition)
        return;

    manualStop = false;

    try {

        if (!isListening) {

            recognition.start();

        }

    } catch (e) {}

}


function stopRecognition() {

    manualStop = true;

    if (recognition) {

        try {

            recognition.stop();

        } catch (e) {}

    }

    isListening = false;

    document
        .getElementById("mic-btn")
        .classList
        .remove("active-mic");

    updateStatus(
        "Microphone off"
    );

}


function updateStatus(text) {

    document
        .getElementById(
            "status-text"
        )
        .textContent = text;

}


/* =========================================================
   WORD DETECTION
   IMPORTANT:
   "human" must NOT trigger "man"
   "woman" must NOT trigger "man"
   ========================================================= */

function hasWord(
    text,
    word
) {

    const escaped =
        word.replace(
            /[.*+?^${}()|[\]\\]/g,
            "\\$&"
        );

    return new RegExp(
        `\\b${escaped}\\b`,
        "i"
    ).test(text);

}


/* =========================================================
   COMMAND PROCESSING
   ========================================================= */

function handleCommand(text) {

    console.log(
        "Voice command:",
        text
    );


    if (
        hasWord(
            text,
            "flower"
        )
    ) {

        activateFlower();

    }


    if (
        hasWord(
            text,
            "tree"
        )
    ) {

        activateTree();

    }


    if (
        hasWord(
            text,
            "house"
        )
    ) {

        activateHouse();

    }


    if (
        hasWord(
            text,
            "butterfly"
        )
    ) {

        activateButterfly();

    }


    if (
        hasWord(
            text,
            "bird"
        )
    ) {

        activateBird();

    }


    if (
        hasWord(
            text,
            "cloud"
        )
    ) {

        activateCloud();

    }


    if (
        hasWord(
            text,
            "rain"
        )
    ) {

        activateRain();

    }


    if (
        hasWord(
            text,
            "river"
        )
    ) {

        activateRiver();

    }


    if (
        hasWord(
            text,
            "boat"
        )
    ) {

        activateBoat();

    }


    if (
        hasWord(
            text,
            "rainbow"
        )
    ) {

        activateRainbow();

    }


    /* Day */

    if (
        hasWord(
            text,
            "day"
        ) ||
        hasWord(
            text,
            "sun"
        )
    ) {

        activateSun();

    }


    /* Night */

    if (
        hasWord(
            text,
            "night"
        ) ||
        hasWord(
            text,
            "moon"
        )
    ) {

        activateMoon();

    }


    /* Star */

    if (
        hasWord(
            text,
            "star"
        ) ||
        hasWord(
            text,
            "stars"
        )
    ) {

        activateStarsCommand();

    }


    /* Dog */

    if (
        hasWord(
            text,
            "dog"
        )
    ) {

        activateDog();

    }


    /* Cat */

    if (
        hasWord(
            text,
            "cat"
        )
    ) {

        activateCat();

    }


    /* IMPORTANT:
       human checked separately using word boundary */

    if (
        hasWord(
            text,
            "human"
        )
    ) {

        activateHuman();

    }


    /* Man */

    if (
        hasWord(
            text,
            "man"
        )
    ) {

        activateMan();

    }


    /* Woman */

    if (
        hasWord(
            text,
            "woman"
        )
    ) {

        activateWoman();

    }


    /* Snow */

    if (
        hasWord(
            text,
            "snow"
        )
    ) {

        activateSnow();

    }

}

    playRiverSound();

    document
        .getElementById(
            "river-zone"
        )
        .classList
        .add("visible");

}


function activateBoat() {

    playBoatSound();

    activateRiver();

    document
        .getElementById(
            "boat-obj"
        )
        .classList
        .add("active");

}


/* =========================================================

    );

    rainbowActive = true;

    rainbow.classList.remove(

/* =========================================================
   DOG
   ========================================================= */

function activateDog() {

    playDogSound();

    if (
        dogCount <
        maxElements
    ) {

        const dog =
            document.getElementById(
                `dog-${dogCount}`
            );

        if (dog) {

            dog.classList.add(
                "active"
            );

            dogCount++;

        }

    } else {

        pulseLatest(
            "dog-item"
        );

    }

}

/* =========================================================
   SNOW
   ========================================================= */

function activateSnow() {

    playSnowSound();

    const snow =
        document.getElementById(
            "snow-layer"
        );

    snow.classList.add(
        "active"
    );

    snowActive = true;

    if (
        snow.children.length === 0
    ) {

        for (
            let i = 0;
            i < 45;
            i++
        ) {

            const flake =
                document.createElement(
                    "div"
                );

            flake.className =
                "snowflake";

            const size =
                4 +
                Math.random() * 7;

            flake.style.width =
                `${size}px`;

            flake.style.height =
                `${size}px`;

            flake.style.left =
                `${Math.random() * 100}%`;

            flake.style.animationDuration =
                `${5 + Math.random() * 7}s`;

            flake.style.animationDelay =
                `${Math.random() * 5}s`;

            snow.appendChild(
                flake
            );

        }

    }

}


/* =========================================================
   PULSE
   ========================================================= */

function pulseLatest(
    className
) {

    const items =
        document.querySelectorAll(
            `.${className}.active`
        );

    if (
        items.length === 0
    )
        return;

    const target =
        items[
            items.length - 1
        ];

    target.classList.remove(
        "highlight-pulse"
    );

    void target.offsetWidth;

    target.classList.add(
        "highlight-pulse"
    );

}


/* =========================================================
   RESET
   ========================================================= */

function resetGarden() {

    flowerCount = 0;
    treeCount = 0;
    butterflyCount = 0;
    birdCount = 0;
    cloudCount = 0;

    dogCount = 0;
    catCount = 0;
    manCount = 0;
    womanCount = 0;
    humanCount = 0;

    isNight = false;

    rainbowActive = false;

    snowActive = false;

    starsManuallyVisible = false;


    document.body.classList.remove(
        "night"
    );


    document
        .querySelectorAll(
            `
            .flower-item,
            .tree-item,
            .butterfly-item,
            .bird-item,
            .cloud-item,
            .creature
            `
        )
        .forEach(el => {

            el.classList.remove(
                "active",
                "highlight-pulse"
            );

        });


    document
        .getElementById(
            "house-obj"
        )
        .classList.remove(
            "active"
        );


    document
        .getElementById(
            "rain-layer"
        )
        .classList.remove(
            "active"
        );


    document
        .getElementById(
            "snow-layer"
        )
        .classList.remove(
            "active"
        );


    document
        .getElementById(
            "river-zone"
        )
        .classList.remove(
            "visible"
        );


    document
        .getElementById(
            "boat-obj"
        )
        .classList.remove(
            "active"
        );


    document
        .getElementById(
            "rainbow-obj"
        )
        .classList.remove(
            "active"
        );


    document
        .getElementById(
            "stars-container"
        )
        .classList.remove(
            "manual-visible"
        );


    updateStatus(
        "Garden reset"
    );


    setTimeout(() => {

        updateStatus(
            isListening
                ? "Listening..."
                : "Microphone off"
        );

    }, 1200);

}


/* =========================================================
   UI EVENTS
   ========================================================= */

window.addEventListener(
    "DOMContentLoaded",
    () => {

        initGardenElements();

        setupSpeechRecognition();


        /* Microphone */

        document
            .getElementById(
                "mic-btn"
            )
            .addEventListener(
                "click",
                () => {

                    initAudio();

                    if (
                        isListening
                    ) {

                        stopRecognition();

                    } else {

                        startRecognition();

                    }

                }
            );


        /* Music */

        document
            .getElementById(
                "music-btn"
            )
            .addEventListener(
                "click",
                () => {

                    if (
                        isMusicPlaying
                    ) {

                        stopBackgroundMusic();

                    } else {

                        startBackgroundMusic();

                    }

                }
            );


        /* Reset */

        document
            .getElementById(
                "reset-btn"
            )
            .addEventListener(
                "click",
                () => {

                    initAudio();

                    resetGarden();

                }
            );


        /* Welcome */

        setTimeout(
            speakWelcome,
            500
        );

    }
);

</script>
