<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no,
      viewport-fit=cover">

<title>Whispering Garden</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

body{
    touch-action:none;
}

/* =====================================================
   WORLD
===================================================== */

#world{
    position:relative;
    width:100vw;
    height:100dvh;
    overflow:hidden;

    background:
        linear-gradient(
            to bottom,
            #8ed9ff 0%,
            #c7edff 54%,
            #b4df8e 55%,
            #7fc56b 100%
        );
}


/* =====================================================
   SKY
===================================================== */

.sky{
    position:absolute;
    inset:0 0 45% 0;
}


/* =====================================================
   SUN
===================================================== */

.sun{
    position:absolute;

    top:7%;
    right:7%;

    width:clamp(55px,11vw,90px);
    height:clamp(55px,11vw,90px);

    border-radius:50%;

    background:#ffd95c;

    box-shadow:
        0 0 25px rgba(255,220,80,.65),
        0 0 60px rgba(255,220,80,.35);

    z-index:3;
}

.sun.hidden{
    display:none;
}


/* =====================================================
   MOON
===================================================== */

.moon{
    position:absolute;

    top:7%;
    right:8%;

    width:clamp(50px,10vw,82px);
    height:clamp(50px,10vw,82px);

    border-radius:50%;

    background:#fffbdc;

    box-shadow:
        0 0 30px rgba(255,255,220,.8);

    display:none;

    z-index:3;
}

.moon.visible{
    display:block;
}


/* =====================================================
   BACKGROUND CLOUDS
===================================================== */

.sky-cloud{
    position:absolute;

    width:clamp(75px,15vw,135px);
    height:32px;

    background:white;

    border-radius:30px;

    opacity:.8;

    z-index:1;
}

.sky-cloud:before,
.sky-cloud:after{
    content:"";

    position:absolute;

    background:white;

    border-radius:50%;
}

.sky-cloud:before{
    width:42px;
    height:42px;

    left:18px;
    top:-20px;
}

.sky-cloud:after{
    width:50px;
    height:50px;

    right:14px;
    top:-25px;
}

.bg-cloud-1{
    top:13%;
    left:7%;
}

.bg-cloud-2{
    top:25%;
    left:36%;
    transform:scale(.72);
}

.bg-cloud-3{
    top:15%;
    left:63%;
    transform:scale(.6);
}


/* =====================================================
   GROUND
===================================================== */

.ground{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:46%;

    background:
        linear-gradient(
            to bottom,
            #a8dc86,
            #7fc56b
        );

    z-index:1;
}


/* =====================================================
   RIVER
   FIXED CENTER-BOTTOM POSITION
   HIDDEN INITIALLY
===================================================== */

#river{
    position:absolute;

    width:32%;
    height:30%;

    left:34%;
    bottom:0;

    background:
        linear-gradient(
            to bottom,
            #67c9ee,
            #43aeda
        );

    border-radius:
        45% 45% 0 0;

    box-shadow:
        inset 0 8px 12px rgba(255,255,255,.25);

    opacity:0;

    transform:scaleY(0);

    transform-origin:bottom;

    transition:
        opacity .8s ease,
        transform .8s ease;

    z-index:2;
}

#river.visible{
    opacity:1;
    transform:scaleY(1);
}


/* Water lines */

.water{
    position:absolute;

    left:10%;
    width:80%;

    height:3px;

    border-radius:50%;

    background:rgba(255,255,255,.5);

    animation:waterMove 3s ease-in-out infinite;
}

.water-1{
    top:25%;
}

.water-2{
    top:45%;
    animation-delay:.7s;
}

.water-3{
    top:65%;
    animation-delay:1.2s;
}

.water-4{
    top:82%;
    animation-delay:1.8s;
}

@keyframes waterMove{

    0%,100%{
        transform:translateX(-5px);
        opacity:.35;
    }

    50%{
        transform:translateX(5px);
        opacity:.75;
    }
}


/* =====================================================
   GARDEN OBJECTS
===================================================== */

#objects{
    position:absolute;
    inset:0;

    z-index:10;

    pointer-events:none;
}


/* =====================================================
   FLOWERS
   SIX FIXED POSITIONS
===================================================== */

.flower{
    position:absolute;

    font-size:clamp(30px,6vw,50px);

    animation:bloom .55s ease;

    filter:
        drop-shadow(
            0 3px 3px rgba(0,0,0,.15)
        );
}


/* LEFT GARDEN */

.flower-1{
    left:5%;
    bottom:10%;
}

.flower-2{
    left:17%;
    bottom:17%;
}

.flower-3{
    left:27%;
    bottom:8%;
}


/* RIGHT GARDEN */

.flower-4{
    right:27%;
    bottom:8%;
}

.flower-5{
    right:16%;
    bottom:17%;
}

.flower-6{
    right:5%;
    bottom:10%;
}


@keyframes bloom{

    0%{
        transform:scale(0);
        opacity:0;
    }

    70%{
        transform:scale(1.15);
    }

    100%{
        transform:scale(1);
        opacity:1;
    }
}


/* =====================================================
   TREES
   FOUR FIXED POSITIONS
===================================================== */

.tree{
    position:absolute;

    font-size:clamp(50px,10vw,90px);

    filter:
        drop-shadow(
            0 5px 4px rgba(0,0,0,.15)
        );

    animation:treeAppear .6s ease;
}


/* FAR LEFT */

.tree-1{
    left:2%;
    bottom:29%;
}


/* LEFT MIDDLE */

.tree-2{
    left:17%;
    bottom:32%;
}


/* RIGHT MIDDLE */

.tree-3{
    right:17%;
    bottom:32%;
}


/* FAR RIGHT */

.tree-4{
    right:2%;
    bottom:29%;
}


@keyframes treeAppear{

    from{
        opacity:0;
        transform:scale(.7);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}


/* =====================================================
   HOUSE
   FIXED TOP OF GRASS
   NEVER ON RIVER
===================================================== */

.house{
    position:absolute;

    left:50%;
    bottom:31%;

    transform:translateX(-50%);

    width:clamp(100px,18vw,160px);
    height:clamp(75px,13vw,115px);

    background:#f3c37b;

    border:
        4px solid #a96d43;

    border-radius:7px;

    animation:houseAppear .6s ease;
}


/* ROOF */

.house:before{
    content:"";

    position:absolute;

    left:-16%;
    top:-48%;

    width:132%;
    height:70%;

    background:#c65c50;

    clip-path:
        polygon(
            50% 0,
            100% 100%,
            0 100%
        );
}


/* DOOR */

.house:after{
    content:"";

    position:absolute;

    left:38%;
    bottom:0;

    width:24%;
    height:48%;

    background:#80523d;

    border-radius:
        5px 5px 0 0;
}


/* WINDOWS */

.house-window{
    position:absolute;

    top:27%;

    width:23%;
    height:26%;

    background:#94ddf0;

    border:
        3px solid #79513d;
}

.window-left{
    left:10%;
}

.window-right{
    right:10%;
}


@keyframes houseAppear{

    from{
        opacity:0;
        transform:
            translateX(-50%)
            scale(.7);
    }

    to{
        opacity:1;
        transform:
            translateX(-50%)
            scale(1);
    }
}


/* =====================================================
   BUTTERFLIES
===================================================== */

.butterfly{
    position:absolute;

    font-size:clamp(28px,5vw,48px);

    animation:
        butterflyMove
        4s ease-in-out infinite;
}


/* LEFT OF HOUSE */

.butterfly-1{
    left:31%;
    bottom:28%;
}


/* RIGHT OF HOUSE */

.butterfly-2{
    right:30%;
    bottom:25%;

    animation-delay:1.2s;
}


@keyframes butterflyMove{

    0%,100%{
        transform:
            translate(0,0);
    }

    50%{
        transform:
            translate(12px,-12px);
    }
}


/* =====================================================
   BIRDS
===================================================== */

.bird{
    position:absolute;

    font-size:clamp(28px,5vw,48px);

    animation:
        birdMove
        5s ease-in-out infinite;
}


/* LEFT SKY */

.bird-1{
    left:18%;
    top:29%;
}


/* CENTER SKY */

.bird-2{
    left:53%;
    top:23%;

    animation-delay:1.5s;
}


@keyframes birdMove{

    0%,100%{
        transform:translateX(0);
    }

    50%{
        transform:
            translateX(25px)
            translateY(-8px);
    }
}


/* =====================================================
   COMMAND CLOUDS
===================================================== */

.command-cloud{
    position:absolute;

    font-size:clamp(42px,8vw,70px);

    animation:
        cloudMove
        5s ease-in-out infinite;
}


/* LEFT TOP */

.command-cloud-1{
    left:28%;
    top:12%;
}


/* RIGHT TOP */

.command-cloud-2{
    right:25%;
    top:29%;

    animation-delay:1.5s;
}


@keyframes cloudMove{

    0%,100%{
        transform:translateX(0);
    }

    50%{
        transform:translateX(12px);
    }
}


/* =====================================================
   BOAT
   INSIDE RIVER
===================================================== */

.boat{
    position:absolute;

    left:50%;
    bottom:11%;

    transform:translateX(-50%);

    font-size:clamp(38px,7vw,62px);

    animation:
        boatMove
        3s ease-in-out infinite;
}


@keyframes boatMove{

    0%,100%{
        transform:
            translateX(-50%)
            translateY(0);
    }

    50%{
        transform:
            translateX(-50%)
            translateY(-4px);
    }
}


/* =====================================================
   RAIN
===================================================== */

#rain{
    position:absolute;

    inset:0;

    z-index:30;

    opacity:0;

    pointer-events:none;

    transition:.4s;
}

#rain.visible{
    opacity:1;
}

.raindrop{
    position:absolute;

    width:2px;
    height:18px;

    background:
        rgba(255,255,255,.6);

    animation:
        rainFall
        linear
        infinite;
}

@keyframes rainFall{

    from{
        transform:translateY(-30px);
    }

    to{
        transform:translateY(110vh);
    }
}


/* =====================================================
   TITLE
===================================================== */

.topbar{
    position:absolute;

    z-index:60;

    top:
        env(
            safe-area-inset-top,
            10px
        );

    left:0;
    right:0;

    padding:
        10px 15px;

    display:flex;

    justify-content:
        space-between;

    align-items:center;

    pointer-events:none;
}

.title{
    color:white;

    font-weight:bold;

    font-size:
        clamp(
            17px,
            4.5vw,
            28px
        );

    text-shadow:
        0 2px 4px rgba(0,0,0,.25);
}

.music-status{
    background:
        rgba(255,255,255,.82);

    padding:
        6px 10px;

    border-radius:20px;

    color:#477354;

    font-size:11px;
}


/* =====================================================
   GUIDE
===================================================== */

.guide{
    position:absolute;

    z-index:65;

    top:
        clamp(
            52px,
            9vh,
            82px
        );

    left:50%;

    transform:
        translateX(-50%);

    width:min(90%,560px);

    background:
        rgba(255,255,255,.92);

    border-radius:18px;

    padding:
        10px 14px;

    text-align:center;

    box-shadow:
        0 7px 20px
        rgba(0,0,0,.12);
}

.guide-title{
    font-size:13px;

    font-weight:bold;

    color:#47775a;
}

.guide-text{
    margin-top:3px;

    color:#526158;

    font-size:
        clamp(
            11px,
            3vw,
            14px
        );

    line-height:1.35;
}


/* =====================================================
   CONTROLS
===================================================== */

.controls{
    position:absolute;

    z-index:80;

    bottom:
        calc(
            7px +
            env(
                safe-area-inset-bottom,
                0px
            )
        );

    left:50%;

    transform:
        translateX(-50%);

    display:flex;

    gap:8px;

    width:95%;

    justify-content:center;
}

button{
    border:0;

    border-radius:18px;

    padding:
        11px 16px;

    font-size:13px;

    font-weight:bold;

    box-shadow:
        0 5px 14px
        rgba(0,0,0,.15);
}

.voice-btn{
    background:white;

    color:#427455;
}

.voice-btn.listening{
    background:#e4f7df;

    box-shadow:
        0 0 0 4px
        rgba(100,190,110,.18),
        0 5px 14px
        rgba(0,0,0,.15);
}

.reset-btn{
    background:#f7e3c3;

    color:#735638;
}


/* =====================================================
   START SCREEN
===================================================== */

#startScreen{
    position:absolute;

    inset:0;

    z-index:100;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

    background:
        linear-gradient(
            rgba(80,145,94,.42),
            rgba(80,145,94,.35)
        ),
        #b9e6b0;
}

.start-card{
    width:min(92%,450px);

    padding:
        28px 22px;

    border-radius:25px;

    background:
        rgba(255,255,255,.96);

    text-align:center;

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.18);
}

.start-card h1{
    color:#47775a;

    font-size:
        clamp(
            25px,
            7vw,
            38px
        );

    margin-bottom:10px;
}

.start-card p{
    color:#52645a;

    font-size:14px;

    line-height:1.55;

    margin-bottom:20px;
}

.start-btn{
    border:0;

    background:#76bd72;

    color:white;

    font-size:16px;

    padding:
        14px 25px;

    border-radius:20px;
}


/* =====================================================
   PHONE
===================================================== */

@media(max-width:600px){

    .guide{
        top:67px;
    }

    .guide-text{
        font-size:11px;
    }

    .house{
        bottom:30%;
    }

    .tree{
        font-size:55px;
    }

    .flower{
        font-size:32px;
    }
}


/* =====================================================
   SMALL PHONE
===================================================== */

@media(max-width:380px){

    .title{
        font-size:16px;
    }

    .music-status{
        font-size:10px;
        padding:5px 8px;
    }

    .guide{
        top:63px;
        width:92%;
        padding:8px 10px;
    }

    .guide-text{
        font-size:10px;
    }

    .tree{
        font-size:48px;
    }

    .flower{
        font-size:28px;
    }

    .house{
        width:95px;
        height:70px;
    }

    button{
        padding:
            9px 12px;

        font-size:11px;
    }
}

</style>
</head>


<body>

<div id="world">

    <!-- ================= SKY ================= -->

    <div class="sky">

        <div id="sun" class="sun"></div>

        <div id="moon" class="moon"></div>

        <!-- BACKGROUND CLOUDS -->

        <div class="sky-cloud bg-cloud-1"></div>
        <div class="sky-cloud bg-cloud-2"></div>
        <div class="sky-cloud bg-cloud-3"></div>

    </div>


    <!-- ================= GROUND ================= -->

    <div class="ground"></div>


    <!-- ================= RIVER ================= -->

    <div id="river">

        <div class="water water-1"></div>
        <div class="water water-2"></div>
        <div class="water water-3"></div>
        <div class="water water-4"></div>

    </div>


    <!-- ================= RAIN ================= -->

    <div id="rain"></div>


    <!-- ================= OBJECTS ================= -->

    <div id="objects"></div>


    <!-- ================= TOP BAR ================= -->

    <div class="topbar">

        <div class="title">
            🌿 Whispering Garden
        </div>

        <div
            id="musicStatus"
            class="music-status">

            🎵 Music off

        </div>

    </div>


    <!-- ================= GUIDE ================= -->

    <div class="guide">

        <div class="guide-title">
            🌼 Garden Guide
        </div>

        <div
            id="guideText"
            class="guide-text">

            Press Begin Garden.

        </div>

    </div>


    <!-- ================= CONTROLS ================= -->

    <div class="controls">

        <button
            id="voiceButton"
            class="voice-btn">

            🎙️ Speak

        </button>

        <button
            id="resetButton"
            class="reset-btn">

            🌱 Reset

        </button>

    </div>


    <!-- ================= START SCREEN ================= -->

    <div id="startScreen">

        <div class="start-card">

            <h1>
                🌿 Whispering Garden
            </h1>

            <p>
                A peaceful garden that responds to your voice.
            </p>

            <button
                id="startButton"
                class="start-btn">

                🌱 Begin Garden

            </button>

        </div>

    </div>

</div>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const objects =
    document.getElementById("objects");

const river =
    document.getElementById("river");

const rain =
    document.getElementById("rain");

const sun =
    document.getElementById("sun");

const moon =
    document.getElementById("moon");

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const voiceButton =
    document.getElementById("voiceButton");

const resetButton =
    document.getElementById("resetButton");

const guideText =
    document.getElementById("guideText");

const musicStatus =
    document.getElementById("musicStatus");


/* =====================================================
   AUDIO
===================================================== */

let audioContext = null;

let musicTimer = null;

let musicStarted = false;

function initAudio(){

    if(!audioContext){

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if(
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();

    }

}


/* =====================================================
   GENTLE TONE
===================================================== */

function tone(
    frequency,
    duration,
    volume,
    type="sine"
){

    if(!audioContext) return;

    const now =
        audioContext.currentTime;

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type = type;

    oscillator.frequency.setValueAtTime(
        frequency,
        now
    );

    gain.gain.setValueAtTime(
        0.0001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        now + .03
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        now + duration
    );

    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );

    oscillator.start(now);

    oscillator.stop(
        now + duration + .05
    );
}


/* =====================================================
   FLOWER BLING
===================================================== */

function flowerSound(){

    tone(
        880,
        .16,
        .035
    );

    setTimeout(
        ()=>{
            tone(
                1175,
                .22,
                .028
            );
        },
        90
    );

}


/* =====================================================
   BIRD CHIRP
===================================================== */

function birdSound(){

    if(!audioContext) return;

    const now =
        audioContext.currentTime;

    const osc =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    osc.type = "sine";

    osc.frequency.setValueAtTime(
        1250,
        now
    );

    osc.frequency.exponentialRampToValueAtTime(
        2100,
        now + .12
    );

    osc.frequency.exponentialRampToValueAtTime(
        1450,
        now + .24
    );

    gain.gain.setValueAtTime(
        .0001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        .03,
        now + .03
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        now + .3
    );

    osc.connect(gain);

    gain.connect(
        audioContext.destination
    );

    osc.start(now);

    osc.stop(
        now + .32
    );

}


/* =====================================================
   RIVER SOUND
===================================================== */

let riverTimer = null;

function riverSound(){

    if(!audioContext) return;

    if(riverTimer) return;

    function pulse(){

        if(
            !river.classList.contains(
                "visible"
            )
        ){

            riverTimer = null;

            return;
        }

        tone(
            260 +
            Math.random()*80,
            .35,
            .006
        );

        riverTimer =
            setTimeout(
                pulse,
                500 +
                Math.random()*500
            );
    }

    pulse();
}


/* =====================================================
   RAIN SOUND
===================================================== */

let rainTimer = null;

function rainSound(){

    if(!audioContext) return;

    if(rainTimer) return;

    function drop(){

        if(
            !rain.classList.contains(
                "visible"
            )
        ){

            rainTimer = null;

            return;
        }

        tone(
            700 +
            Math.random()*900,
            .07,
            .003
        );

        rainTimer =
            setTimeout(
                drop,
                90 +
                Math.random()*150
            );
    }

    drop();
}


/* =====================================================
   CALM BACKGROUND MUSIC
===================================================== */

const melody = [

    261.63,
    329.63,
    392.00,
    329.63,

    293.66,
    349.23,
    440.00,
    349.23

];

let melodyIndex = 0;

function playMusicNote(){

    if(!audioContext) return;

    const note =
        melody[melodyIndex];

    melodyIndex =
        (
            melodyIndex + 1
        ) %
        melody.length;

    tone(
        note,
        2.8,
        .005,
        "sine"
    );
}

function startMusic(){

    if(musicStarted)
        return;

    initAudio();

    musicStarted = true;

    musicStatus.textContent =
        "🎵 Calm music";

    playMusicNote();

    musicTimer =
        setInterval(
            playMusicNote,
            3200
        );
}


/* =====================================================
   RAIN DROPS
===================================================== */

function createRain(){

    rain.innerHTML = "";

    for(
        let i=0;
        i<75;
        i++
    ){

        const drop =
            document.createElement(
                "div"
            );

        drop.className =
            "raindrop";

        drop.style.left =
            Math.random()*100 +
            "%";

        drop.style.animationDuration =
            (
                .7 +
                Math.random()*.7
            ) + "s";

        drop.style.animationDelay =
            (
                -Math.random()*2
            ) + "s";

        rain.appendChild(drop);
    }
}

/* =====================================================
   SPEECH RECOGNITION
===================================================== */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;

let recognitionRunning =
    false;

let manuallyStopped =
    true;


if(SpeechRecognition){

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "en-IN";

    recognition.continuous =
        true;

    recognition.interimResults =
        false;

    recognition.maxAlternatives =
        1;


    recognition.onstart =
        function(){

            recognitionRunning =
                true;

            voiceButton.classList.add(
                "listening"
            );

            voiceButton.textContent =
                "🎙️ Listening...";

        };


    recognition.onresult =
        function(event){

            for(
                let i =
                    event.resultIndex;

                i <
                    event.results.length;

                i++
            ){

                if(
                    event.results[i]
                        .isFinal
                ){

                    const text =
                        event.results[i][0]
                            .transcript
                            .toLowerCase()
                            .trim();

                    processCommand(
                        text
                    );

                }

            }

        };


    recognition.onerror =
        function(event){

            recognitionRunning =
                false;

            voiceButton.classList.remove(
                "listening"
            );

            voiceButton.textContent =
                "🎙️ Speak";

            if(
                event.error ===
                "not-allowed"
            ){

                manuallyStopped =
                    true;

                guideText.textContent =
                    "Please allow microphone access.";

            }

        };


    recognition.onend =
        function(){

            recognitionRunning =
                false;

            voiceButton.classList.remove(
                "listening"
            );

            voiceButton.textContent =
                "🎙️ Speak";


            if(
                !manuallyStopped
            ){

                setTimeout(
                    startRecognition,
                    250
                );

            }

        };

}


/* =====================================================
   START RECOGNITION
===================================================== */

function startRecognition(){

    if(!recognition)
        return;

    if(recognitionRunning)
        return;

    if(manuallyStopped)
        return;

    try{

        recognition.start();

    }catch(error){

    }

}


/* =====================================================
   STOP RECOGNITION
===================================================== */

function stopRecognition(){

    manuallyStopped =
        true;

    if(
        recognition &&
        recognitionRunning
    ){

        try{

            recognition.stop();

        }catch(e){}

    }

    recognitionRunning =
        false;

    voiceButton.classList.remove(
        "listening"
    );

    voiceButton.textContent =
        "🎙️ Speak";
}


/* =====================================================
   COMMAND PROCESSING
===================================================== */

function processCommand(
    text
){

    console.log(
        "Voice:",
        text
    );


    if(
        text.includes("flower") ||
        text.includes("flowers") ||
        text.includes("bloom")
    ){

        addFlower();

        return;
    }


    if(
        text.includes("tree") ||
        text.includes("trees")
    ){

        addTree();

        return;
    }


    if(
        text.includes("house") ||
        text.includes("home")
    ){

        addHouse();

        return;
    }


    if(
        text.includes("butterfly") ||
        text.includes("butterflies")
    ){

        addButterfly();

        return;
    }


    if(
        text.includes("bird") ||
        text.includes("birds")
    ){

        addBird();

        return;
    }


    if(
        text.includes("cloud") ||
        text.includes("clouds")
    ){

        addCloud();

        return;
    }


    if(
        text.includes("rain") ||
        text.includes("raining")
    ){

        activateRain();

        return;
    }


    if(
        text.includes("river") ||
        text.includes("water")
    ){

        activateRiver();

        return;
    }


    if(
        text.includes("boat")
    ){

        addBoat();

        return;
    }


    if(
        text.includes("sun") ||
        text.includes("day")
    ){

        setDay();

        return;
    }


    if(
        text.includes("moon") ||
        text.includes("night")
    ){

        setNight();

        return;
    }

}

voiceButton.addEventListener(
    "click",
    function(){

        initAudio();

        if(!recognition){

            guideText.textContent =
                "Voice recognition is not supported. Please use Chrome.";

            return;
        }


        if(
            recognitionRunning
        ){

            stopRecognition();

        }else{

            manuallyStopped =
                false;

            startRecognition();

        }

    }
);


/* =====================================================
   START
===================================================== */

startButton.addEventListener(
    "click",
    function(){

        /*
           Initialize audio only.
           Do NOT start music yet.
        */

        initAudio();

        startScreen.style.display =
            "none";

        guideText.textContent =
            "Listen to the garden guide...";


        /*
           MICROPHONE IS OFF WHILE
           THE GUIDE IS SPEAKING.
        */

        stopRecognition();


        speechSynthesis.cancel();


        const message =
            "Welcome to the garden. " +
            "You can say flower, tree, house, butterfly, bird, cloud, rain, river, boat, sun, moon.";


        const speech =
            new SpeechSynthesisUtterance(
                message
            );

        speech.lang =
            "en-IN";

        speech.rate =
            0.9;

        speech.pitch =
            1.0;

        speech.volume =
            0.9;


        speech.onend =
            function(){

                /*
                   THE COMPLETE SENTENCE
                   HAS FINISHED.

                   NOW START MUSIC.
                */

                startMusic();


                guideText.textContent =
                    "Your garden is ready. Speak whenever you like.";


                /*
                   Give the audio system a
                   small moment to settle.

                   THEN start microphone.
                */

                setTimeout(
                    function(){

                        manuallyStopped =
                            false;

                        startRecognition();

                    },
                    600
                );

            };


        speech.onerror =
            function(){

                startMusic();

                setTimeout(
                    function(){

                        manuallyStopped =
                            false;

                        startRecognition();

                    },
                    600
                );

            };


        speechSynthesis.speak(
            speech
        );

    }
);
