<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no,
      viewport-fit=cover">

<title>Whispering Garden</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#bde7ff;
}

body{
    touch-action:none;
}

/* =========================
   WORLD
========================= */

#world{
    position:relative;
    width:100vw;
    height:100dvh;
    min-height:520px;
    overflow:hidden;
    background:linear-gradient(
        to bottom,
        #8ed8ff 0%,
        #bcecff 52%,
        #dff6c9 53%,
        #9bd47c 100%
    );
}

/* =========================
   SKY
========================= */

.sky{
    position:absolute;
    inset:0 0 45% 0;
    pointer-events:none;
}

/* Sun */

.sun{
    position:absolute;
    top:8%;
    right:7%;
    width:clamp(55px,12vw,95px);
    height:clamp(55px,12vw,95px);
    border-radius:50%;
    background:#ffd95c;
    box-shadow:
        0 0 30px rgba(255,220,80,.55),
        0 0 70px rgba(255,220,80,.25);
    transition:.8s ease;
}

.sun.hidden{
    opacity:0;
    transform:scale(.5);
}

/* Moon */

.moon{
    position:absolute;
    top:8%;
    right:8%;
    width:clamp(50px,11vw,82px);
    height:clamp(50px,11vw,82px);
    border-radius:50%;
    background:#f7f3d0;
    box-shadow:0 0 35px rgba(255,255,220,.7);
    opacity:0;
    transform:scale(.5);
    transition:.8s ease;
}

.moon.visible{
    opacity:1;
    transform:scale(1);
}

.moon:after{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background:#8ed8ff;
    left:18px;
    top:-7px;
}

/* Clouds */

.sky-cloud{
    position:absolute;
    width:clamp(75px,15vw,140px);
    height:35px;
    background:white;
    border-radius:50px;
    opacity:.82;
}

.sky-cloud:before,
.sky-cloud:after{
    content:"";
    position:absolute;
    background:white;
    border-radius:50%;
}

.sky-cloud:before{
    width:45px;
    height:45px;
    left:18px;
    top:-22px;
}

.sky-cloud:after{
    width:55px;
    height:55px;
    right:15px;
    top:-28px;
}

.cloud1{
    top:13%;
    left:7%;
}

.cloud2{
    top:23%;
    left:37%;
    transform:scale(.75);
}

.cloud3{
    top:11%;
    left:63%;
    transform:scale(.62);
}

/* Stars */

#stars{
    position:absolute;
    inset:0;
    opacity:0;
    transition:.8s;
}

.star{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:white;
    box-shadow:0 0 7px white;
}

/* =========================
   GROUND
========================= */

.ground{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:47%;
    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(255,255,255,.12) 0 2px,
            transparent 3px
        ),
        linear-gradient(
            to bottom,
            #a7dc86,
            #7fc66d
        );
}

/* Grass strips */

.grass-line{
    position:absolute;
    bottom:0;
    height:6px;
    background:#69ad58;
    border-radius:50%;
    opacity:.5;
}

.gl1{
    left:5%;
    width:20%;
}

.gl2{
    left:40%;
    width:24%;
}

.gl3{
    right:4%;
    width:22%;
}

/* =========================
   RIVER
   HIDDEN INITIALLY
========================= */

#river{
    position:absolute;
    width:42%;
    height:30%;
    left:29%;
    bottom:-2%;
    background:
        linear-gradient(
            180deg,
            #69c8ed,
            #46aeda
        );
    border-radius:48% 48% 0 0;
    box-shadow:
        inset 0 10px 0 rgba(255,255,255,.2),
        inset 0 0 20px rgba(0,80,130,.12);
    transform:scaleY(0);
    transform-origin:bottom;
    opacity:0;
    transition:
        transform .9s ease,
        opacity .9s ease;
    z-index:2;
}

#river.visible{
    transform:scaleY(1);
    opacity:1;
}

.water-line{
    position:absolute;
    left:8%;
    width:84%;
    height:3px;
    border-radius:50%;
    background:rgba(255,255,255,.55);
    animation:waterMove 3s ease-in-out infinite;
}

.w1{top:25%;}
.w2{top:45%;animation-delay:.7s;}
.w3{top:67%;animation-delay:1.2s;}
.w4{top:83%;animation-delay:1.8s;}

@keyframes waterMove{
    0%,100%{transform:translateX(-5px);opacity:.35}
    50%{transform:translateX(5px);opacity:.75}
}

/* =========================
   OBJECT LAYER
========================= */

#objects{
    position:absolute;
    inset:0;
    z-index:5;
}

/* =========================
   FLOWERS
========================= */

.flower{
    position:absolute;
    font-size:clamp(32px,7vw,58px);
    animation:bloom .6s ease;
    filter:drop-shadow(0 4px 3px rgba(0,0,0,.15));
}

.f1{left:8%;bottom:13%}
.f2{left:20%;bottom:22%}
.f3{left:35%;bottom:10%}
.f4{right:29%;bottom:13%}
.f5{right:17%;bottom:23%}
.f6{right:6%;bottom:12%}

@keyframes bloom{
    0%{
        transform:scale(0);
        opacity:0;
    }
    70%{
        transform:scale(1.15);
    }
    100%{
        transform:scale(1);
        opacity:1;
    }
}

/* =========================
   TREES
========================= */

.tree{
    position:absolute;
    font-size:clamp(55px,12vw,105px);
    filter:drop-shadow(0 6px 5px rgba(0,0,0,.15));
    animation:treeAppear .7s ease;
}

.t1{
    left:2%;
    bottom:28%;
}

.t2{
    left:14%;
    bottom:34%;
}

.t3{
    right:3%;
    bottom:29%;
}

.t4{
    right:15%;
    bottom:36%;
}

@keyframes treeAppear{
    from{
        opacity:0;
        transform:translateY(20px) scale(.7);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

/* =========================
   HOUSE
   FIXED ON LEFT-MIDDLE LAND
========================= */

.house{
    position:absolute;
    left:39%;
    bottom:30%;
    width:clamp(100px,20vw,180px);
    height:clamp(80px,15vw,130px);
    background:#f3c27a;
    border:4px solid #b87948;
    border-radius:8px;
    animation:houseAppear .7s ease;
}

/* roof */

.house:before{
    content:"";
    position:absolute;
    left:-18%;
    top:-48%;
    width:136%;
    height:75%;
    background:#c95e52;
    clip-path:polygon(50% 0,100% 100%,0 100%);
}

/* door */

.house:after{
    content:"";
    position:absolute;
    width:24%;
    height:48%;
    bottom:0;
    left:38%;
    background:#87543c;
    border-radius:6px 6px 0 0;
}

.house-window{
    position:absolute;
    width:23%;
    height:27%;
    background:#8edff4;
    border:3px solid #765442;
    top:27%;
}

.hw1{left:10%}
.hw2{right:10%}

@keyframes houseAppear{
    from{
        opacity:0;
        transform:scale(.7);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

/* =========================
   BUTTERFLY
========================= */

.butterfly{
    position:absolute;
    font-size:clamp(30px,6vw,52px);
    animation:flyButterfly 4s ease-in-out infinite;
}

.b1{
    left:27%;
    bottom:33%;
}

.b2{
    right:24%;
    bottom:31%;
    animation-delay:1.5s;
}

@keyframes flyButterfly{
    0%,100%{
        transform:translate(0,0) rotate(-5deg);
    }
    50%{
        transform:translate(18px,-16px) rotate(5deg);
    }
}

/* =========================
   BIRDS
========================= */

.bird{
    position:absolute;
    font-size:clamp(30px,6vw,55px);
    animation:birdFly 5s ease-in-out infinite;
}

.bird1{
    left:17%;
    top:22%;
}

.bird2{
    left:52%;
    top:17%;
    animation-delay:1.5s;
}

@keyframes birdFly{
    0%,100%{
        transform:translateX(0);
    }
    50%{
        transform:translateX(35px) translateY(-8px);
    }
}

/* =========================
   CLOUD COMMAND OBJECTS
========================= */

.command-cloud{
    position:absolute;
    font-size:clamp(45px,9vw,75px);
    animation:cloudFloat 5s ease-in-out infinite;
}

.cc1{
    left:29%;
    top:12%;
}

.cc2{
    right:25%;
    top:25%;
    animation-delay:1.2s;
}

@keyframes cloudFloat{
    0%,100%{transform:translateX(0)}
    50%{transform:translateX(15px)}
}

/* =========================
   BOAT
========================= */

.boat{
    position:absolute;
    left:50%;
    bottom:9%;
    transform:translateX(-50%);
    font-size:clamp(40px,8vw,65px);
    animation:boatFloat 3s ease-in-out infinite;
}

@keyframes boatFloat{
    0%,100%{transform:translateX(-50%) translateY(0)}
    50%{transform:translateX(-50%) translateY(-4px)}
}

/* =========================
   RAIN
========================= */

#rain{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:20;
    opacity:0;
    transition:.4s;
}

#rain.visible{
    opacity:1;
}

.raindrop{
    position:absolute;
    width:2px;
    height:20px;
    background:rgba(255,255,255,.65);
    animation:rainFall linear infinite;
}

@keyframes rainFall{
    from{
        transform:translateY(-30px);
    }
    to{
        transform:translateY(110vh);
    }
}

/* =========================
   TOP UI
========================= */

.topbar{
    position:absolute;
    z-index:50;
    top:env(safe-area-inset-top,10px);
    left:0;
    right:0;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    pointer-events:none;
}

.title{
    color:white;
    font-size:clamp(18px,5vw,30px);
    font-weight:700;
    text-shadow:0 2px 4px rgba(0,0,0,.2);
}

.music-status{
    background:rgba(255,255,255,.75);
    padding:7px 11px;
    border-radius:20px;
    font-size:12px;
    color:#37634a;
}

/* =========================
   GUIDE
========================= */

.guide{
    position:absolute;
    z-index:60;
    top:clamp(55px,10vh,90px);
    left:50%;
    transform:translateX(-50%);
    width:min(90%,560px);
    background:rgba(255,255,255,.92);
    border-radius:18px;
    padding:12px 15px;
    text-align:center;
    box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.guide-title{
    font-weight:bold;
    color:#47775a;
    font-size:14px;
}

.guide-text{
    margin-top:4px;
    color:#425449;
    font-size:clamp(12px,3.2vw,15px);
    line-height:1.4;
}

/* =========================
   CONTROLS
========================= */

.controls{
    position:absolute;
    z-index:70;
    left:50%;
    transform:translateX(-50%);
    bottom:10px;
    width:min(94%,600px);
    display:flex;
    justify-content:center;
    gap:10px;
}

button{
    border:0;
    border-radius:18px;
    padding:12px 18px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 5px 15px rgba(0,0,0,.14);
}

.voice-btn{
    background:#ffffff;
    color:#427455;
}

.voice-btn.listening{
    background:#e5f7dc;
    box-shadow:
        0 0 0 4px rgba(100,190,110,.2),
        0 5px 15px rgba(0,0,0,.14);
}

.reset-btn{
    background:#f7e4c6;
    color:#735638;
}

/* =========================
   START SCREEN
========================= */

#startScreen{
    position:absolute;
    inset:0;
    z-index:100;
    background:
        linear-gradient(
            rgba(72,139,88,.42),
            rgba(75,139,95,.32)
        ),
        #b9e6b0;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
}

.start-card{
    width:min(92%,460px);
    background:rgba(255,255,255,.96);
    border-radius:25px;
    padding:30px 22px;
    text-align:center;
    box-shadow:0 15px 45px rgba(0,0,0,.2);
}

.start-card h1{
    color:#47775a;
    font-size:clamp(25px,7vw,40px);
    margin-bottom:10px;
}

.start-card p{
    color:#52645a;
    line-height:1.6;
    font-size:14px;
    margin-bottom:22px;
}

.start-btn{
    background:#76bd72;
    color:white;
    font-size:17px;
    padding:14px 28px;
    border-radius:20px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    #world{
        min-height:500px;
    }

    .guide{
        top:68px;
        padding:9px 12px;
    }

    .guide-text{
        font-size:12px;
    }

    .house{
        left:39%;
        bottom:30%;
    }

    .tree{
        font-size:58px;
    }

    .flower{
        font-size:35px;
    }

    .controls{
        bottom:7px;
    }

    button{
        padding:11px 15px;
        font-size:13px;
    }
}

/* Small phones */

@media(max-width:380px){

    .guide{
        top:63px;
    }

    .guide-text{
        font-size:11px;
    }

    .house{
        width:95px;
        height:75px;
        bottom:31%;
    }

    .tree{
        font-size:50px;
    }

    .flower{
        font-size:30px;
    }

    .controls{
        gap:6px;
    }

    button{
        padding:9px 12px;
        font-size:12px;
    }
}

/* Landscape phone */

@media(max-height:500px){

    .guide{
        top:50px;
        padding:7px 10px;
    }

    .guide-text{
        display:none;
    }

    .controls{
        bottom:5px;
    }
}
</style>
</head>

<body>

<div id="world">

    <!-- SKY -->
    <div class="sky">

        <div id="sun" class="sun"></div>
        <div id="moon" class="moon"></div>

        <div class="sky-cloud cloud1"></div>
        <div class="sky-cloud cloud2"></div>
        <div class="sky-cloud cloud3"></div>

        <div id="stars"></div>

    </div>

    <!-- GROUND -->
    <div class="ground">

        <div class="grass-line gl1"></div>
        <div class="grass-line gl2"></div>
        <div class="grass-line gl3"></div>

    </div>

    <!-- RIVER: HIDDEN UNTIL COMMAND -->
    <div id="river">
        <div class="water-line w1"></div>
        <div class="water-line w2"></div>
        <div class="water-line w3"></div>
        <div class="water-line w4"></div>
    </div>

    <!-- RAIN -->
    <div id="rain"></div>

    <!-- OBJECTS -->
    <div id="objects"></div>

    <!-- TOP -->
    <div class="topbar">

        <div class="title">
            🌿 Whispering Garden
        </div>

        <div class="music-status" id="musicStatus">
            🎵 Calm garden
        </div>

    </div>

    <!-- GUIDE -->
    <div class="guide">

        <div class="guide-title">
            🌼 Garden Guide
        </div>

        <div class="guide-text" id="guideText">
            Press Begin Garden to start.
        </div>

    </div>

    <!-- CONTROLS -->
    <div class="controls">

        <button
            id="voiceButton"
            class="voice-btn">
            🎙️ Speak
        </button>

        <button
            id="resetButton"
            class="reset-btn">
            🌱 Reset
        </button>

    </div>

    <!-- START SCREEN -->
    <div id="startScreen">

        <div class="start-card">

            <h1>🌿 Whispering Garden</h1>

            <p>
                Listen to the garden guide first.
                <br>
                Then speak gently to grow your garden.
                <br><br>
                Say words such as
                <b>flower, tree, house, bird, rain, river</b>
                and more.
            </p>

            <button
                id="startButton"
                class="start-btn">
                🌱 Begin Garden
            </button>

        </div>

    </div>

</div>

<script>

/* =========================================================
   ELEMENTS
========================================================= */

const objects = document.getElementById("objects");
const river = document.getElementById("river");
const rain = document.getElementById("rain");
const sun = document.getElementById("sun");
const moon = document.getElementById("moon");
const stars = document.getElementById("stars");

const startScreen = document.getElementById("startScreen");
const startButton = document.getElementById("startButton");

const voiceButton = document.getElementById("voiceButton");
const resetButton = document.getElementById("resetButton");

const guideText = document.getElementById("guideText");
const musicStatus = document.getElementById("musicStatus");


/* =========================================================
   AUDIO ENGINE
========================================================= */

let audioContext = null;
let musicTimer = null;
let musicStarted = false;

function initAudio(){

    if(!audioContext){

        audioContext =
            new (window.AudioContext ||
                 window.webkitAudioContext)();

    }

    if(audioContext.state === "suspended"){
        audioContext.resume();
    }
}


/* =========================================================
   BASIC TONE
========================================================= */

function tone(
    frequency,
    duration = 0.25,
    volume = 0.03,
    type = "sine"
){

    if(!audioContext) return;

    const now = audioContext.currentTime;

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type = type;
    oscillator.frequency.setValueAtTime(
        frequency,
        now
    );

    gain.gain.setValueAtTime(
        0.0001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        now + 0.02
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + duration
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start(now);
    oscillator.stop(now + duration + .03);
}


/* =========================================================
   FLOWER BLING
========================================================= */

function flowerBling(){

    if(!audioContext) return;

    tone(880,.18,.035,"sine");

    setTimeout(()=>{
        tone(1175,.22,.028,"sine");
    },90);

}


/* =========================================================
   BIRD CHIRPING
========================================================= */

function birdChirp(){

    if(!audioContext) return;

    const now =
        audioContext.currentTime;

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type = "sine";

    oscillator.frequency.setValueAtTime(
        1300,
        now
    );

    oscillator.frequency.exponentialRampToValueAtTime(
        2100,
        now + .12
    );

    oscillator.frequency.exponentialRampToValueAtTime(
        1500,
        now + .24
    );

    gain.gain.setValueAtTime(
        .0001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        .035,
        now + .03
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        now + .3
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start(now);
    oscillator.stop(now + .32);

    setTimeout(()=>{
        tone(1900,.16,.025,"sine");
    },220);
}


/* =========================================================
   RIVER FLOWING SOUND
========================================================= */

let riverSoundTimer = null;

function startRiverSound(){

    if(!audioContext) return;

    if(riverSoundTimer) return;

    function waterPulse(){

        if(!river.classList.contains("visible")){
            riverSoundTimer = null;
            return;
        }

        tone(
            260 + Math.random()*90,
            .35,
            .008,
            "sine"
        );

        riverSoundTimer =
            setTimeout(
                waterPulse,
                500 + Math.random()*500
            );
    }

    waterPulse();
}


/* =========================================================
   RAIN SOUND
========================================================= */

let rainSoundTimer = null;

function startRainSound(){

    if(!audioContext) return;

    if(rainSoundTimer) return;

    function rainDropSound(){

        if(!rain.classList.contains("visible")){
            rainSoundTimer = null;
            return;
        }

        tone(
            700 + Math.random()*900,
            .08,
            .004,
            "sine"
        );

        rainSoundTimer =
            setTimeout(
                rainDropSound,
                80 + Math.random()*180
            );
    }

    rainDropSound();
}


/* =========================================================
   TREE SOUND
========================================================= */

function treeSound(){

    tone(320,.35,.018,"sine");

    setTimeout(()=>{
        tone(420,.4,.012,"sine");
    },180);
}


/* =========================================================
   HOUSE SOUND
========================================================= */

function houseSound(){

    tone(390,.25,.018,"sine");

    setTimeout(()=>{
        tone(520,.35,.015,"sine");
    },130);
}


/* =========================================================
   BUTTERFLY SOUND
========================================================= */

function butterflySound(){

    tone(740,.2,.015,"sine");

    setTimeout(()=>{
        tone(930,.25,.012,"sine");
    },120);
}


/* =========================================================
   CLOUD SOUND
========================================================= */

function cloudSound(){

    tone(420,.5,.012,"sine");
}


/* =========================================================
   BOAT SOUND
========================================================= */

function boatSound(){

    tone(280,.3,.015,"sine");

    setTimeout(()=>{
        tone(340,.35,.012,"sine");
    },160);
}


/* =========================================================
   SUN SOUND
========================================================= */

function sunSound(){

    tone(520,.3,.018,"sine");

    setTimeout(()=>{
        tone(660,.4,.014,"sine");
    },130);
}


/* =========================================================
   MOON SOUND
========================================================= */

function moonSound(){

    tone(440,.5,.012,"sine");

    setTimeout(()=>{
        tone(330,.6,.009,"sine");
    },180);
}


/* =========================================================
   CALM BACKGROUND MUSIC
========================================================= */

const melody = [
    261.63,
    329.63,
    392.00,
    329.63,
    293.66,
    349.23,
    440.00,
    349.23
];

let melodyIndex = 0;

function playBackgroundNote(){

    if(!audioContext) return;

    const frequency =
        melody[melodyIndex];

    melodyIndex =
        (melodyIndex + 1) % melody.length;

    tone(
        frequency,
        2.5,
        .006,
        "sine"
    );
}

function startMusic(){

    if(musicStarted) return;

    initAudio();

    musicStarted = true;

    musicStatus.textContent =
        "🎵 Calm music";

    playBackgroundNote();

    musicTimer =
        setInterval(
            playBackgroundNote,
            3200
        );
}

/* =========================================================
   SPEECH RECOGNITION
========================================================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;

let recognitionRunning = false;

let manuallyStopped = true;

if(SpeechRecognition){

    recognition =
        new SpeechRecognition();

    recognition.lang = "en-IN";

    recognition.continuous = true;

    /*
       IMPORTANT:
       Final results only.
       This prevents the recognizer from reacting
       to partial fragments and becoming unstable.
    */
    recognition.interimResults = false;

    recognition.maxAlternatives = 1;


    recognition.onstart = function(){

        recognitionRunning = true;

        voiceButton.classList.add("listening");

        voiceButton.textContent =
            "🎙️ Listening...";
    };


    recognition.onresult = function(event){

        for(
            let i = event.resultIndex;
            i < event.results.length;
            i++
        ){

            if(
                event.results[i].isFinal
            ){

                const text =
                    event.results[i][0]
                    .transcript
                    .toLowerCase()
                    .trim();

                processCommand(text);
            }
        }
    };


    recognition.onerror = function(event){

        recognitionRunning = false;

        voiceButton.classList.remove("listening");

        voiceButton.textContent =
            "🎙️ Speak";

        if(
            event.error === "not-allowed" ||
            event.error === "service-not-allowed"
        ){

            guideText.textContent =
                "Please allow microphone access.";

            manuallyStopped = true;
        }
    };


    recognition.onend = function(){

        recognitionRunning = false;

        voiceButton.classList.remove("listening");

        voiceButton.textContent =
            "🎙️ Speak";

        /*
           If recognition stopped unexpectedly,
           restart only when we are supposed to be listening.
        */

        if(!manuallyStopped){

            setTimeout(()=>{
                startRecognition();
            },300);
        }
    };
}


/* =========================================================
   START RECOGNITION
========================================================= */

function startRecognition(){

    if(!recognition) return;

    if(recognitionRunning) return;

    if(manuallyStopped) return;

    try{

        recognition.start();

    }catch(error){

        /*
           Browser may throw if start() is called
           while it is already starting.
        */

    }
}


/* =========================================================
   STOP RECOGNITION
========================================================= */

function stopRecognition(){

    manuallyStopped = true;

    if(
        recognition &&
        recognitionRunning
    ){

        try{
            recognition.stop();
        }catch(e){}
    }

    recognitionRunning = false;

    voiceButton.classList.remove("listening");

    voiceButton.textContent =
        "🎙️ Speak";
}


/* =========================================================
   SPEAK ONLY AT BEGINNING
========================================================= */

function speakInstructions(text, finishedCallback){

    /*
       VERY IMPORTANT:
       Stop microphone BEFORE speaking.

       Therefore the microphone cannot hear
       the guide's own voice.
    */

    stopRecognition();

    if(!("speechSynthesis" in window)){

        if(finishedCallback){
            finishedCallback();
        }

        return;
    }

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang = "en-IN";

    utterance.rate = 0.88;

    utterance.pitch = 1.0;

    utterance.volume = 0.9;


    utterance.onend = function(){

        /*
           Recognition starts ONLY after the
           complete sentence has finished.
        */

        if(finishedCallback){

            setTimeout(
                finishedCallback,
                500
            );
        }
    };


    utterance.onerror = function(){

        if(finishedCallback){

            setTimeout(
                finishedCallback,
                500
            );
        }
    };


    speechSynthesis.speak(utterance);
}


/* =========================================================
   PROCESS COMMAND
========================================================= */

function processCommand(text){

    console.log("Heard:",text);

    if(
        text.includes("flower") ||
        text.includes("flowers") ||
        text.includes("bloom")
    ){

        addFlower();
        return;
    }


    if(
        text.includes("tree") ||
        text.includes("trees")
    ){

        addTree();
        return;
    }


    if(
        text.includes("house") ||
        text.includes("home")
    ){

        addHouse();
        return;
    }


    if(
        text.includes("butterfly") ||
        text.includes("butterflies")
    ){

        addButterfly();
        return;
    }


    if(
        text.includes("bird") ||
        text.includes("birds")
    ){

        addBird();
        return;
    }


    if(
        text.includes("cloud") ||
        text.includes("clouds")
    ){

        addCloud();
        return;
    }


    if(
        text.includes("rain") ||
        text.includes("raining")
    ){

        activateRain();
        return;
    }


    if(
        text.includes("river") ||
        text.includes("water")
    ){

        activateRiver();
        return;
    }


    if(
        text.includes("boat")
    ){

        addBoat();
        return;
    }


    if(
        text.includes("sun") ||
        text.includes("day")
    ){

        setDay();
        return;
    }


    if(
        text.includes("moon") ||
        text.includes("night")
    ){

        setNight();
        return;
    }

}

voiceButton.addEventListener(

        initAudio();

        if(!recognition){

            guideText.textContent =
                "Voice recognition is not supported in this browser. Try Chrome on Android.";

            return;

        if(recognitionRunning){

            stopRecognition();

        }else{

            manuallyStopped = false;

            startRecognition();
        }
    }
);

            setTimeout(()=>{
                tone(659,.25,.02,"sine");
            },120);

                tone(784,.35,.018,"sine");
            },250);
        }

        /*
           IMPORTANT:
           Do NOT automatically speak another long
           tutorial after reset.
           
           User can simply press Speak.
        */

    }
);


/* =========================================================
   PAGE VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    function(){

        if(document.hidden){

            if(
                recognition &&
                recognitionRunning
            ){

                try{
                    recognition.stop();
                }catch(e){}
            }

        }

    }
);
